name: massbank-202603-graph-only-second-source-252
on:
  workflow_dispatch:
  push:
    branches: [research/massbank-graph-only-structural-transfer-20261017]
    paths:
      - '.github/workflows/massbank-graph-only-second-source-252.yml'
      - 'scripts/benchmark_massbank_graph_only_structure_transfer.py'
      - 'tests/test_massbank_graph_only_structure_transfer.py'
permissions:
  contents: read
  actions: read
jobs:
  full-native-graph-only-identification:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: All original MassBank tests and frozen exact graph/null regression tests
        run: |
          set -euxo pipefail
          python -m pip install -e '.[dev]'
          PYTHONPATH=src:. pytest -q
      - name: Enforce prior completed no-peaks graph feasibility gate plus exact archive manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p frozen/massbank_original frozen/msnlib_prior frozen/massbank_graph_gate results/massbank_graph_transfer
          test "$(gh run view 39060743234 --repo "$GITHUB_REPOSITORY" --json conclusion -q .conclusion)" = success
          gh run download 39060743234 --repo "$GITHUB_REPOSITORY" \
            --name massbank-2026-graph-native-header-prescore-lockbox --dir frozen/massbank_graph_gate
          gh run download 38918658343 --repo "$GITHUB_REPOSITORY" \
            --name massbank-2026-03-frozen-external-efficacy --dir frozen/massbank_original
          gh run download 38934839645 --repo "$GITHUB_REPOSITORY" \
            --name posthoc-massbank-structure-nonoverlap-and-source-robustness --dir frozen/msnlib_prior
          echo '2c973a7b83c1a48f95f923107ee72bb44a2a95f7d7da403f9d6f541d662efc8b  frozen/massbank_original/rows.jsonl' | sha256sum -c -
          echo '265dfb75e33d2eff3f19945255bddb5db0c0f7f9161593ada80cd2b50ecac9c4  frozen/massbank_original/label_free_triplets.jsonl' | sha256sum -c -
          echo '5520ecb3f134290953fd5ad63b97cc1561dd39c2ea658aeaf4a90b2be348d07a  frozen/msnlib_prior/prior_evaluated_key_inventory.json' | sha256sum -c -
          python - <<'PY'
          from pathlib import Path
          import json
          v=json.loads(Path('frozen/massbank_graph_gate/feasibility.json').read_text())
          assert v['status']=='MASSBANK_202603_GRAPH_ONLY_PRESCORE_NATIVE_HEADER_GATE_V1'
          assert v['gate_pass'] is True
          assert v['unchanged_original_queries']==252
          assert v['unchanged_original_formula_blocks']==44
          assert v['n_queries_in_pools_with_all_graph_structures_usable']==220
          assert v['n_formulas_in_pools_with_all_graph_structures_usable']==38
          assert v['experimental_target_peak_lines_opened'] is False
          assert v['experimental_reference_peak_lines_opened'] is False
          PY
      - name: Download exactly frozen MassBank 2026.03 source ZIP
        run: |
          set -euxo pipefail
          ok=0
          for attempt in 1 2 3 4 5 6; do
            rm -f /tmp/massbank-2026.03.zip
            if curl -Lf --retry 3 --retry-all-errors --retry-delay 5 \
                 --connect-timeout 30 --max-time 2400 \
                 'https://zenodo.org/records/19590880/files/MassBank/MassBank-data-2026.03.zip?download=1' \
                 -o /tmp/massbank-2026.03.zip; then
              if echo '1de9018361f7ffc689aa327f92e97e0f  /tmp/massbank-2026.03.zip' | md5sum -c -; then ok=1; break; fi
            fi
            sleep 10
          done
          test "$ok" = 1
          echo '12c6a922929f9bf2484c46586b6101512a415e44680558883b0630c6e47905fb  /tmp/massbank-2026.03.zip' | sha256sum -c -
      - name: Verify native prescore graph records before original withheld target spectra are opened
        run: |
          set -euxo pipefail
          PYTHONPATH=src:. python scripts/benchmark_massbank_graph_only_structure_transfer.py \
            --source /tmp/massbank-2026.03.zip \
            --efficacy frozen/massbank_original \
            --prior-inventory frozen/msnlib_prior/prior_evaluated_key_inventory.json \
            --locked frozen/massbank_graph_gate \
            --out results/massbank_graph_transfer
          cat results/massbank_graph_transfer/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Archive complete all-252 rank results and all positive/negative scientific outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: massbank-202603-graph-only-second-source-252
          path: results/massbank_graph_transfer/
          retention-days: 90
          if-no-files-found: warn
