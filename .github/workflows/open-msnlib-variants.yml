name: open-msnlib-variants

on:
  push:
    branches: [msnlib-open-data]
    paths:
      - 'src/qfd/**'
      - 'scripts/run_msnlib_variants.py'
      - 'tests/**'
      - '.github/workflows/open-msnlib-variants.yml'
  workflow_dispatch:

concurrency:
  group: open-msnlib-variants-${{ github.ref }}
  cancel-in-progress: true

jobs:
  variants:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Run full test suite
        run: PYTHONPATH=src pytest -q
      - name: Download open MSnLib OTAVA positive library
        run: |
          mkdir -p results/msnlib_variants
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://zenodo.org/records/21105617/files/20241003_otavapep_pos_ms2.json?download=1' \
            -o /tmp/msnlib.jsonl
          test -s /tmp/msnlib.jsonl
          sha256sum /tmp/msnlib.jsonl | tee results/msnlib_variants/input_sha256.txt
          wc -l /tmp/msnlib.jsonl | tee results/msnlib_variants/input_line_count.txt
      - name: Run censor-aware and merged-energy variants
        shell: bash
        run: |
          set -o pipefail
          python scripts/run_msnlib_variants.py /tmp/msnlib.jsonl \
            --out-dir results/msnlib_variants \
            --bootstrap 2000 \
            --hard-static-threshold 0.8 2>&1 | tee results/msnlib_variants/run.log
      - name: Show summary
        run: cat results/msnlib_variants/summary.json
      - name: Upload variant results and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msnlib-variant-results
          path: results/msnlib_variants/
          if-no-files-found: ignore
