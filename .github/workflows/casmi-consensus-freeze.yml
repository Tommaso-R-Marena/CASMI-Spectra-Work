name: casmi-consensus-freeze

on:
  push:
    branches: [casmi-consensus-ranker-v2]
    paths:
      - 'src/qfd/**'
      - 'scripts/run_casmi2016_trajectory_dev.py'
      - 'scripts/run_casmi_consensus_nested_cv.py'
      - 'tests/**'
      - '.github/workflows/casmi-consensus-freeze.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: casmi-consensus-freeze-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and benchmark dependencies
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install pandas
      - name: Run full test suite
        run: PYTHONPATH=src pytest -q
      - name: Download and verify CASMI 2016 benchmark
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/casmi2016 /tmp/cfm results/casmi_consensus_freeze/features results/casmi_consensus_freeze/freeze
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://zenodo.org/records/8399738/files/proc_casmi_2016.tgz?download=1' \
            -o /tmp/proc_casmi_2016.tgz
          echo 'c24bae2a10e929d8a1570ae810d45278  /tmp/proc_casmi_2016.tgz' | md5sum -c -
          tar -xzf /tmp/proc_casmi_2016.tgz -C /tmp/casmi2016
      - name: Download and verify CFM predictions
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 --retry-delay 3 \
            'https://zenodo.org/records/8399738/files/cfm.tgz?download=1' \
            -o /tmp/cfm.tgz
          echo '9091cbc446124dc947cb2a7b01fe9c98  /tmp/cfm.tgz' | md5sum -c -
          CFM_MEMBER="$(tar -tzf /tmp/cfm.tgz | grep -E '(^|/)casmi_spec_df\.pkl$' | head -n1)"
          test -n "$CFM_MEMBER"
          tar -xzf /tmp/cfm.tgz -C /tmp/cfm "$CFM_MEMBER"
      - name: Regenerate CASMI 2016 candidate features from raw releases
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=src python scripts/run_casmi2016_trajectory_dev.py \
            /tmp/casmi2016 /tmp/cfm \
            --out-dir results/casmi_consensus_freeze/features \
            --seed 271828 2>&1 | tee results/casmi_consensus_freeze/feature_run.log
      - name: Run nested validation and freeze
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=src python scripts/run_casmi_consensus_nested_cv.py \
            results/casmi_consensus_freeze/features/candidate_features.csv.gz \
            results/casmi_consensus_freeze/features/per_query.csv \
            --out-dir results/casmi_consensus_freeze/freeze \
            2>&1 | tee results/casmi_consensus_freeze/freeze_run.log
      - name: Enforce freeze gate
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('results/casmi_consensus_freeze/freeze/summary.json')
          d=json.loads(p.read_text())
          print(json.dumps({
              'static': d['nested_oof']['static'],
              'gated': d['nested_oof']['gated'],
              'risk': d['nested_oof']['risk'],
              'bootstrap': d['nested_oof']['bootstrap'],
              'signflip': d['nested_oof']['signflip'],
              'threshold': d['frozen_threshold'],
              'weights': d['final_fit_weights'],
              'freeze_gate': d['freeze_gate'],
          }, indent=2))
          if not d['freeze_gate']['pass']:
              raise SystemExit('FAIL CLOSED: CASMI 2016 consensus freeze gate did not pass')
          PY
      - name: Persist frozen model and validation summary
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p benchmark_results
          cp results/casmi_consensus_freeze/freeze/summary.json benchmark_results/casmi_consensus_nested_cv_summary.json
          cp results/casmi_consensus_freeze/freeze/frozen_model.json benchmark_results/casmi_consensus_frozen_model.json
          sha256sum benchmark_results/casmi_consensus_frozen_model.json > benchmark_results/casmi_consensus_frozen_model.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add benchmark_results/casmi_consensus_nested_cv_summary.json \
                  benchmark_results/casmi_consensus_frozen_model.json \
                  benchmark_results/casmi_consensus_frozen_model.sha256
          if ! git diff --cached --quiet; then
            git commit -m 'Freeze CASMI consensus ranker v2'
            git pull --rebase origin casmi-consensus-ranker-v2
            git push origin HEAD:casmi-consensus-ranker-v2
          fi
      - name: Upload freeze artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casmi-consensus-freeze
          path: results/casmi_consensus_freeze/
          if-no-files-found: ignore
