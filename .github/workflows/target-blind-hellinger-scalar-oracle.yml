name: target-blind-hellinger-scalar-oracle

on:
  workflow_dispatch:
  push:
    branches: [research/target-blind-energy-geometry-20261016]
    paths:
      - '.github/workflows/target-blind-hellinger-scalar-oracle.yml'

permissions:
  contents: read

env:
  FROZEN_SCALAR_ORACLE_SHA: 4de02e4323395ef27e99847c3faf63b0dd2ddee6

jobs:
  retrospective-oracle:
    name: ${{ matrix.dataset }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - dataset: mcebio_neg
            file: 20241003_mcebio_neg_ms2.json
            md5: f0b8490cd619c9ea7fdea8de95393c28
          - dataset: mcescaf_pos
            file: 20241003_mcescaf_pos_ms2.json
            md5: 3ba52914a2f27239c5278c7d96888ec
          - dataset: enammol_pos
            file: 20241003_enammol_pos_ms2.json
            md5: ed6db189b4b5e1fc6a8cf3df211dbbe8
          - dataset: enamdisc_neg
            file: 20241003_enamdisc_neg_ms2.json
            md5: ad9c6e971a1902c091aeb4d555ca8db6

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify frozen oracle protocol and code, run unit tests
        run: |
          set -euxo pipefail
          git fetch --depth=1 origin "$FROZEN_SCALAR_ORACLE_SHA"
          git diff --exit-code "$FROZEN_SCALAR_ORACLE_SHA" -- \
            docs/HELLINGER_SCALAR_ORACLE_PROTOCOL.md \
            src/qfd/target_blind_geometry.py \
            tests/test_target_blind_hellinger_oracle.py \
            scripts/benchmark_msnlib_hellinger_oracle.py
          python -m pip install -e '.[dev]'
          PYTHONPATH=src:. pytest -q
      - name: Download and verify previously eligible MSnLib cohort
        shell: bash
        env:
          DATA_FILE: ${{ matrix.file }}
          DATA_MD5: ${{ matrix.md5 }}
        run: |
          set -euxo pipefail
          mkdir -p results/hellinger_oracle/${{ matrix.dataset }}
          ok=0
          for attempt in 1 2 3 4 5 6; do
            rm -f /tmp/msnlib.jsonl
            if curl -L --fail --retry 3 --retry-all-errors --retry-delay 4 \
              --connect-timeout 30 --max-time 1800 \
              "https://zenodo.org/records/21105617/files/${DATA_FILE}?download=1" \
              -o /tmp/msnlib.jsonl; then
              if echo "${DATA_MD5}  /tmp/msnlib.jsonl" | md5sum -c -; then ok=1; break; fi
            fi
            sleep 8
          done
          test "$ok" = 1
          sha256sum /tmp/msnlib.jsonl | tee results/hellinger_oracle/${{ matrix.dataset }}/input_sha256.txt
      - name: Re-enforce original label-free feasibility gate
        id: gate
        shell: bash
        run: |
          set -euxo pipefail
          PYTHONPATH=src:. python scripts/audit_msnlib_energy_geometry_loeo.py \
            /tmp/msnlib.jsonl \
            --dataset "${{ matrix.dataset }}" \
            --out results/hellinger_oracle/${{ matrix.dataset }}/feasibility.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads(Path("results/hellinger_oracle/${{ matrix.dataset }}/feasibility.json").read_text())
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("pass="+("true" if d["gate_pass"] else "false")+"\n")
          print("ORIGINAL_LABEL_FREE_GATE:",d["gate_pass"])
          PY
      - name: Compare alpha-quarter to best Hellinger scalar position
        if: steps.gate.outputs.pass == 'true'
        run: |
          set -euxo pipefail
          PYTHONPATH=src:. python scripts/benchmark_msnlib_hellinger_oracle.py \
            /tmp/msnlib.jsonl \
            --dataset "${{ matrix.dataset }}" \
            --out results/hellinger_oracle/${{ matrix.dataset }}
      - name: Save provenance
        if: always()
        shell: bash
        env:
          DATA_FILE: ${{ matrix.file }}
          DATA_MD5: ${{ matrix.md5 }}
        run: |
          mkdir -p results/hellinger_oracle/${{ matrix.dataset }}
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path('results/hellinger_oracle/${{ matrix.dataset }}')
          p={
            'cohort':'${{ matrix.dataset }}',
            'dataset_file':os.environ['DATA_FILE'],
            'dataset_expected_md5':os.environ['DATA_MD5'],
            'frozen_scalar_oracle_sha':os.environ['FROZEN_SCALAR_ORACLE_SHA'],
            'workflow_commit':os.environ.get('GITHUB_SHA'),
            'evaluation_class':'POSTHOC ANSWER-AWARE ORACLE / NONDEPLOYABLE',
          }
          (root/'provenance.json').write_text(json.dumps(p,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: target-blind-hellinger-oracle-${{ matrix.dataset }}
          path: results/hellinger_oracle/${{ matrix.dataset }}/
          if-no-files-found: warn
          retention-days: 90
