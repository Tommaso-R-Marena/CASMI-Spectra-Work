name: posthoc-three-source-endpoint-geometry-mechanism

on:
  workflow_dispatch:
  push:
    branches: [research/cross-source-endpoint-mechanism-20261016]
    paths:
      - '.github/workflows/posthoc-three-source-endpoint-geometry-mechanism.yml'

permissions:
  contents: read
  actions: read

jobs:
  diagnostic-without-refitting:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify unchanged original source scorers and tests
        run: |
          set -euxo pipefail
          git fetch --depth=1 origin 6c38b731815c19a13b660b86a985ee7387c3b278
          git diff --exit-code 6c38b731815c19a13b660b86a985ee7387c3b278 -- \
            scripts/benchmark_multims2_third_source_geometry.py \
            scripts/benchmark_multims2_third_source_geometry_v2.py \
            scripts/benchmark_massbank_external_energy_geometry.py \
            scripts/benchmark_expolib_frozen_nominal_transfer.py \
            src/qfd/power_geometry.py \
            src/qfd/target_blind_geometry.py
          python -m pip install -e '.[dev]'
          PYTHONPATH=src:. pytest -q
      - name: Download ALL immutable prior source prediction artifacts and ExpoLib metadata manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p frozen/mb frozen/expo frozen/expo_meta frozen/multi results/cross_source_endpoint
          gh run download 38918658343 --repo "$GITHUB_REPOSITORY" \
            --name massbank-2026-03-frozen-external-efficacy --dir frozen/mb
          gh run download 38964797817 --repo "$GITHUB_REPOSITORY" \
            --name expolib-v1-independent-nominal-CE-transfer --dir frozen/expo
          gh run download 38964190641 --repo "$GITHUB_REPOSITORY" \
            --name expolib-v1-independent-header-only-feasibility --dir frozen/expo_meta
          gh run download 38970610885 --repo "$GITHUB_REPOSITORY" \
            --name multims2-third-independent-source-frozen-geometry --dir frozen/multi
          echo '2c973a7b83c1a48f95f923107ee72bb44a2a95f7d7da403f9d6f541d662efc8b  frozen/mb/rows.jsonl' | sha256sum -c -
          echo 'f85b67d61be82f62ee1072944f9d300eb2d1d81462eba6ad221566dfaa276695  frozen/expo/rows.jsonl' | sha256sum -c -
          echo 'f97bfaee05e9197cdaa96ad995ab9019c995274820ff57f3b04bd04de12c2be6  frozen/multi/rows.jsonl' | sha256sum -c -
      - name: Fetch exactly the previous fixed external acquisition source archives
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/cross_source
          fetch_pinned() {
            url="$1"; dest="$2"; expected_md5="$3"
            ok=0
            for attempt in 1 2 3 4 5 6; do
              rm -f "$dest"
              if curl --location --fail --retry 3 --retry-all-errors --retry-delay 4 \
                  --connect-timeout 30 --max-time 2400 "$url" -o "$dest"; then
                if echo "$expected_md5  $dest" | md5sum -c -; then ok=1; break; fi
              fi
              sleep 8
            done
            test "$ok" = 1
          }
          fetch_pinned 'https://zenodo.org/records/19590880/files/MassBank/MassBank-data-2026.03.zip?download=1' \
            /tmp/cross_source/massbank.zip 1de9018361f7ffc689aa327f92e97e0f
          fetch_pinned 'https://zenodo.org/records/18186811/files/ExpoLib1.0_ESI%2B.msp?download=1' \
            /tmp/cross_source/expo_pos.msp c08dcc4dc3c11eef188dff1eb1f2bc1d
          fetch_pinned 'https://zenodo.org/records/18186811/files/ExpoLib1.0_ESI-.msp?download=1' \
            /tmp/cross_source/expo_neg.msp 3a7544d71bf9ee3564243095b3134d3d
      - name: Calculate endpoint-only geometry descriptors, join only existing outcome artifacts
        shell: bash
        run: |
          set -euxo pipefail
          PYTHONPATH=src:. python scripts/audit_cross_source_endpoint_mechanism.py \
            --massbank-zip /tmp/cross_source/massbank.zip \
            --massbank-artifact frozen/mb \
            --expolib-positive /tmp/cross_source/expo_pos.msp \
            --expolib-negative /tmp/cross_source/expo_neg.msp \
            --expolib-artifact frozen/expo \
            --expolib-manifest frozen/expo_meta/nominal_energy_triplets.jsonl \
            --multims2-artifact frozen/multi \
            --out results/cross_source_endpoint
          cat results/cross_source_endpoint/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve nonconfirmatory status even if analysis fails
        if: always()
        shell: bash
        run: |
          mkdir -p results/cross_source_endpoint
          python - <<'PY'
          import json
          from pathlib import Path
          p={"evaluation_class":"POSTHOC SOURCE-ENDPOINT MECHANISTIC HETEROGENEITY ONLY",
             "frozen_massbank_run":38918658343,
             "frozen_expolib_run":38964797817,
             "frozen_multims2_run":38970610885,
             "new_model_training_or_target_spectrum_rescoring":False,
             "selected_descriptors_from_endpoint_spectra_only":True}
          (Path("results/cross_source_endpoint")/"provenance.json").write_text(json.dumps(p,indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: three-source-endpoint-geometry-support-mechanism
          path: results/cross_source_endpoint/
          if-no-files-found: warn
          retention-days: 90
