name: protected-tail-v53-casmi2022-external-audit

on:
  workflow_dispatch:
  push:
    branches: [protected-tail-minimax-v53]
    paths:
      - '.github/workflows/protected-tail-v53-casmi2022-external-audit.yml'

permissions:
  contents: read

concurrency:
  group: protected-tail-v53-casmi2022-external-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install project and verify frozen rule
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install pandas
          PYTHONPATH=src pytest -q

      - name: Download pinned CASMI2022 and CFM inputs
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/data /tmp/cfm results/protected_tail_v53/casmi2022/source
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://zenodo.org/records/8399738/files/proc_casmi_2022.tgz?download=1' \
            -o /tmp/data.tgz
          echo '82364fafaff0ead065c0b7680da34215  /tmp/data.tgz' | md5sum -c -
          tar -xzf /tmp/data.tgz -C /tmp/data

          curl -L --fail --retry 3 --retry-delay 3 \
            'https://zenodo.org/records/8399738/files/cfm.tgz?download=1' \
            -o /tmp/cfm.tgz
          echo '9091cbc446124dc947cb2a7b01fe9c98  /tmp/cfm.tgz' | md5sum -c -
          MEMBER="$(tar -tzf /tmp/cfm.tgz | grep -E '(^|/)casmi22_spec_df\.pkl$' | head -n1)"
          test -n "$MEMBER"
          tar -xzf /tmp/cfm.tgz -C /tmp/cfm "$MEMBER"

      - name: Regenerate the previously hashed candidate-feature table
        shell: bash
        run: |
          set -euxo pipefail
          PYTHONPATH=src:scripts python scripts/run_casmi2022_consensus_lockbox.py \
            /tmp/data /tmp/cfm benchmark_results/casmi_consensus_frozen_model.json \
            --out-dir results/protected_tail_v53/casmi2022/source
          sha256sum results/protected_tail_v53/casmi2022/source/candidate_features.csv.gz

      - name: Apply frozen v5.2 and v5.3 without retuning
        shell: bash
        run: |
          set -euxo pipefail
          PYTHONPATH=src python scripts/analyze_protected_tail_v53.py \
            results/protected_tail_v53/casmi2022/source/candidate_features.csv.gz \
            --out results/protected_tail_v53/casmi2022/protected_tail_v53.json \
            --overlap-threshold 0.8 \
            --protected-k 1 \
            --overlap-k 10 \
            --head-survival-slack 1 \
            --rr-cutoff 25 \
            --role external_to_selector_audit

      - name: Verify source identity against prior v5.1 audit
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          p = Path('results/protected_tail_v53/casmi2022/source/candidate_features.csv.gz')
          h = hashlib.sha256(p.read_bytes()).hexdigest()
          expected = 'ae786e96c7099a07c6a80c50e51bc8148712161e3a7b6bd620bf5734b285c7db'
          print(json.dumps({'candidate_features_sha256': h, 'expected_prior_sha256': expected, 'match': h == expected}, indent=2))
          if h != expected:
              raise SystemExit('candidate feature table does not match prior external-audit source')
          PY

      - name: Record provenance
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('results/protected_tail_v53/casmi2022/provenance.json').write_text(json.dumps({
              'dataset': 'casmi2022',
              'evaluation_role': 'external_to_selector_audit',
              'not_pristine_end_to_end_confirmation': True,
              'rule_version': 'protected-tail-v5.3-minimax-tail',
              'git_sha': os.environ.get('GITHUB_SHA'),
              'parameters_frozen_on_nist20_development': {
                  'overlap_threshold': 0.8,
                  'protected_k': 1,
                  'overlap_k': 10,
                  'head_survival_slack': 1,
              },
              'expected_candidate_features_sha256': 'ae786e96c7099a07c6a80c50e51bc8148712161e3a7b6bd620bf5734b285c7db',
          }, indent=2) + '\n')
          PY

      - name: Upload replay, diagnostics, and reusable candidate table
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protected-tail-v53-casmi2022
          path: |
            results/protected_tail_v53/casmi2022/protected_tail_v53.json
            results/protected_tail_v53/casmi2022/provenance.json
            results/protected_tail_v53/casmi2022/source/candidate_features.csv.gz
          if-no-files-found: warn
          retention-days: 90
