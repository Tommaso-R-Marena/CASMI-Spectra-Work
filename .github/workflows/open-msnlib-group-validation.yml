name: open-msnlib-group-validation

on:
  push:
    branches: [msnlib-group-validation]
    paths:
      - 'src/qfd/**'
      - 'scripts/run_msnlib_group_validation.py'
      - 'tests/**'
      - '.github/workflows/open-msnlib-group-validation.yml'
  workflow_dispatch:

concurrency:
  group: open-msnlib-group-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Run full test suite
        run: PYTHONPATH=src pytest -q
      - name: Download and verify open MSnLib OTAVA positive library
        run: |
          mkdir -p results/msnlib_group_validation
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://zenodo.org/records/21105617/files/20241003_otavapep_pos_ms2.json?download=1' \
            -o /tmp/msnlib.jsonl
          test -s /tmp/msnlib.jsonl
          sha256sum /tmp/msnlib.jsonl | tee results/msnlib_group_validation/input_sha256.txt
          wc -l /tmp/msnlib.jsonl | tee results/msnlib_group_validation/input_line_count.txt
          echo '40379ce382fdc0622e313eb65e94937ac6f282f01be076e92d568683c5613db5  /tmp/msnlib.jsonl' | sha256sum -c -
          test "$(wc -l < /tmp/msnlib.jsonl)" -eq 6670
      - name: Run frozen formula-heldout validation
        shell: bash
        run: |
          set -o pipefail
          python scripts/run_msnlib_group_validation.py /tmp/msnlib.jsonl \
            --out-dir results/msnlib_group_validation \
            --bootstrap 5000 \
            --validation-fraction 0.5 \
            --hard-static-threshold 0.8 2>&1 | tee results/msnlib_group_validation/run.log
      - name: Show summary
        run: cat results/msnlib_group_validation/summary.json
      - name: Upload validation results and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msnlib-group-validation-results
          path: results/msnlib_group_validation/
          if-no-files-found: ignore
