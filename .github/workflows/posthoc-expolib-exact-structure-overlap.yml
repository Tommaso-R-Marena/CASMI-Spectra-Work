name: posthoc-expolib-exact-structure-overlap

on:
  workflow_dispatch:
  push:
    branches: [research/expolib-overlap-falsification-20261016]
    paths:
      - '.github/workflows/posthoc-expolib-exact-structure-overlap.yml'

permissions:
  contents: read
  actions: read

jobs:
  no-refitting-identity-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run full CI and require original prediction code unchanged
        run: |
          set -euxo pipefail
          git fetch --depth=1 origin e56451679142147b291918519e2b2c1261846a07
          git diff --exit-code e56451679142147b291918519e2b2c1261846a07 -- \
            scripts/benchmark_expolib_frozen_nominal_transfer.py \
            docs/EXPOLIB_FROZEN_NOMINAL_TRANSFER_PROTOCOL.md \
            scripts/audit_expolib_nominal_energy_feasibility.py
          python -m pip install -e '.[dev]'
          PYTHONPATH=src:. pytest -q
      - name: Download EXACT four pre-existing run artifacts without re-running spectrum scores
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p frozen/expolib-scored frozen/expolib-gate frozen/prior-msnlib frozen/prior-massbank results/expolib_overlap
          gh run download 38964797817 --repo "$GITHUB_REPOSITORY" \
            --name expolib-v1-independent-nominal-CE-transfer --dir frozen/expolib-scored
          gh run download 38964190641 --repo "$GITHUB_REPOSITORY" \
            --name expolib-v1-independent-header-only-feasibility --dir frozen/expolib-gate
          gh run download 38934839645 --repo "$GITHUB_REPOSITORY" \
            --name posthoc-massbank-structure-nonoverlap-and-source-robustness --dir frozen/prior-msnlib
          gh run download 38918658343 --repo "$GITHUB_REPOSITORY" \
            --name massbank-2026-03-frozen-external-efficacy --dir frozen/prior-massbank
      - name: Audit all exact full-InChIKeys and CI without changing original denominator
        run: |
          set -euxo pipefail
          PYTHONPATH=src:. python scripts/audit_expolib_source_overlap.py \
            --expolib-result-dir frozen/expolib-scored \
            --expolib-metadata-dir frozen/expolib-gate \
            --prior-inventory frozen/prior-msnlib/prior_evaluated_key_inventory.json \
            --massbank-manifest frozen/prior-massbank/label_free_triplets.jsonl \
            --out results/expolib_overlap
          cat results/expolib_overlap/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expolib-exact-prior-source-overlap-sensitivity
          path: results/expolib_overlap/
          if-no-files-found: warn
          retention-days: 90
