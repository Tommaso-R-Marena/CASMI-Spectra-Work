name: expolib-frozen-nominal-CE-transfer

on:
  workflow_dispatch:
  push:
    branches: [research/expolib-frozen-nominal-transfer-20261016]
    paths:
      - '.github/workflows/expolib-frozen-nominal-CE-transfer.yml'

permissions:
  contents: read
  actions: read

env:
  FROZEN_SOURCE_SCORER_SHA: e56451679142147b291918519e2b2c1261846a07

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preserve frozen independent-source research protocol and verify tests
        shell: bash
        run: |
          set -euxo pipefail
          git fetch --depth=1 origin "$FROZEN_SOURCE_SCORER_SHA"
          git diff --exit-code "$FROZEN_SOURCE_SCORER_SHA" -- \
            docs/EXPOLIB_FROZEN_NOMINAL_TRANSFER_PROTOCOL.md \
            scripts/benchmark_expolib_frozen_nominal_transfer.py \
            tests/test_expolib_frozen_nominal_transfer.py
          python -m pip install -e '.[dev]'
          PYTHONPATH=src:. pytest -q
      - name: Fetch and verify ORIGINAL header-only gate output; refuse re-selection
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p frozen/gate results/expolib_nominal_transfer
          gh run download 38964190641 --repo "$GITHUB_REPOSITORY" \
            --name expolib-v1-independent-header-only-feasibility --dir frozen/gate
          echo 'fbf4a6ab01bdf536dad09edc6dfcb100ee133ada0f4cabddb1d4d6b956f7af42  frozen/gate/feasibility.json' | sha256sum -c -
          echo '095340d967b177077ce517da7aa332795ce691899cc1320563cce07a76a68560  frozen/gate/nominal_energy_triplets.jsonl' | sha256sum -c -
      - name: Download the exact independently acquired ExpoLib v1 raw spectral files
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/expolib
          download_md5() {
            url="$1"; dest="$2"; checksum="$3"
            ok=0
            for attempt in 1 2 3 4 5 6; do
              rm -f "$dest"
              if curl -L --fail --retry 3 --retry-all-errors --retry-delay 4 \
                 --connect-timeout 30 --max-time 1800 "$url" -o "$dest"; then
                if echo "$checksum  $dest" | md5sum -c -; then ok=1; break; fi
              fi
              sleep 8
            done
            test "$ok" = 1
          }
          download_md5 'https://zenodo.org/records/18186811/files/ExpoLib1.0_ESI%2B.msp?download=1' \
            /tmp/expolib/positive.msp c08dcc4dc3c11eef188dff1eb1f2bc1d
          download_md5 'https://zenodo.org/records/18186811/files/ExpoLib1.0_ESI-.msp?download=1' \
            /tmp/expolib/negative.msp 3a7544d71bf9ee3564243095b3134d3d
          echo 'aa838492fe11bd068819d3bc872541d7ec727217440dd5d2595af8985fb56959  /tmp/expolib/positive.msp' | sha256sum -c -
          echo 'b26e11b25c4ee5d24507e5aa9b525540096a4347cfdfbce94d230e4e858fa838  /tmp/expolib/negative.msp' | sha256sum -c -
          sha256sum /tmp/expolib/*.msp > results/expolib_nominal_transfer/input_sha256.txt
      - name: Score unchanged alpha-quarter against Hellinger, support-only and exact scalar oracle
        shell: bash
        run: |
          set -euxo pipefail
          PYTHONPATH=src:. python scripts/benchmark_expolib_frozen_nominal_transfer.py \
            --positive /tmp/expolib/positive.msp \
            --negative /tmp/expolib/negative.msp \
            --gate-dir frozen/gate \
            --out results/expolib_nominal_transfer
          cat results/expolib_nominal_transfer/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Record permanent provenance even if source validation fails
        if: always()
        run: |
          mkdir -p results/expolib_nominal_transfer
          python - <<'PY'
          import json,os
          from pathlib import Path
          p={
            "source":"ExpoLib v1, Zenodo 18186811, University of Vienna",
            "scientific_class":"EXTERNAL ACQUISITION SOURCE / NOMINAL CE / PHYSICAL UNITS UNVERIFIED",
            "original_metadata_only_gate_run":38964190641,
            "frozen_scoring_sha":os.environ["FROZEN_SOURCE_SCORER_SHA"],
            "workflow_sha":os.getenv("GITHUB_SHA"),
            "exponent_retuned":False,
            "reported_collision_energy_unit_eV_verified":False,
          }
          (Path("results/expolib_nominal_transfer")/"provenance.json").write_text(json.dumps(p,indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expolib-v1-independent-nominal-CE-transfer
          path: results/expolib_nominal_transfer/
          if-no-files-found: warn
          retention-days: 90
