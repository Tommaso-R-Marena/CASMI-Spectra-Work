name: multims2-ead-frozen-survival-transfer
on:
  workflow_dispatch:
  push:
    branches: [research/multims2-ead-mechanism-lockbox-20261016]
    paths:
      - 'docs/EAD_SCORE_LAUNCH_20261016.txt'
permissions:
  contents: read
  actions: read
env:
  PREDICTOR_PREOUTCOME_SHA: 4295a1ae7ead5f56a0d5b57a772cd651032d1362
  EAD_HEADER_ONLY_GATE_RUN: '38985385615'
jobs:
  frozen-ead-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prove pre-outcome hybrid code, score implementation, metadata parser and protocol remain frozen
        run: |
          set -euxo pipefail
          git fetch --depth=1 origin "$PREDICTOR_PREOUTCOME_SHA"
          git diff --exit-code "$PREDICTOR_PREOUTCOME_SHA" -- \
            scripts/audit_multims2_ead_metadata.py \
            scripts/benchmark_multims2_ead_lockbox.py \
            src/qfd/persistent_survival.py \
            tests/test_persistent_survival.py \
            docs/MULTIMS2_EAD_HYBRID_LOCKBOX_PROTOCOL_20261016.md
          python -m pip install -e '.[dev]'
          PYTHONPATH=src:. pytest -q
      - name: Retrieve successful predecessor META-ONLY gate and unchanged original CID inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p frozen/ead_gate frozen/cid /tmp/ead_score results/ead_scored
          test "$(gh run view "$EAD_HEADER_ONLY_GATE_RUN" --repo "$GITHUB_REPOSITORY" --json conclusion -q .conclusion)" = success
          gh run download "$EAD_HEADER_ONLY_GATE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name multims2-ead-header-only-frozen-feasibility --dir frozen/ead_gate
          gh run download 38970318925 --repo "$GITHUB_REPOSITORY" \
            --name multims2-third-source-metadata-v2-fixed-brackets --dir frozen/cid
          echo '5345f532ded9baa4134d38b840a6e05a1b1f85b3cf19923569ea80d96f46289d  frozen/cid/frozen_triplets.jsonl' | sha256sum -c -
          python - <<'PY'
          from pathlib import Path
          import json
          a=json.loads(Path("frozen/ead_gate/feasibility.json").read_text())
          assert a["status"]=="MULTIMS2_EAD_12_16_24EV_HEADER_ONLY_GATE_V1"
          assert a["gate_pass"] is True
          assert a["16eV_target_peak_positions_or_intensities_read"] is False
          assert a["target_scores_or_predictor_outcomes_opened"] is False
          assert a["source_sha256"]=="4ef86f75a12ad2fdadbd63732e2d6690f4e506a6ff08f171758c1808d1249673"
          print("FROZEN EAD HEADER-ONLY GATE PASSED",a["coverage"])
          PY
      - name: Download exact previously pinned 77MB CC0 MultiMS2 MGF
        run: |
          set -euxo pipefail
          curl -L --fail --retry 6 --retry-all-errors --retry-delay 4 --connect-timeout 30 --max-time 2400 \
            'https://raw.githubusercontent.com/zamboni-lab/MultiMS2/659bd9b608408a75ecbb4b03295ed4c03ba52539/data/multims2_spectra.mgf' \
            -o /tmp/ead_score/source.mgf
          test "$(stat -c '%s' /tmp/ead_score/source.mgf)" = 77183510
          echo '4ef86f75a12ad2fdadbd63732e2d6690f4e506a6ff08f171758c1808d1249673  /tmp/ead_score/source.mgf' | sha256sum -c -
      - name: OPEN EAD target peaks ONLY after successful source metadata gate and frozen-code checks
        run: |
          set -euxo pipefail
          PYTHONPATH=src:. python scripts/benchmark_multims2_ead_lockbox.py \
            --mgf /tmp/ead_score/source.mgf \
            --gate-dir frozen/ead_gate \
            --cid-manifest frozen/cid/frozen_triplets.jsonl \
            --out results/ead_scored
          cat results/ead_scored/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve complete outcome and failure provenance
        if: always()
        run: |
          mkdir -p results/ead_scored
          python - <<'PY'
          import json,os
          from pathlib import Path
          p={
             "evaluation_class":"NEW HELD-OUT EAD FRAGMENTATION MODALITY, SAME MultiMS2 SOURCE",
             "frozen_prediction_and_protocol_sha":os.environ["PREDICTOR_PREOUTCOME_SHA"],
             "original_header_only_gate_run":int(os.environ["EAD_HEADER_ONLY_GATE_RUN"]),
             "original_CID_scored_run":38970610885,
             "pre_outcome_fit_or_EAD_hyperparameter_tuning":False,
             "physical_law_or_new_laboratory_replication_claim":False,
             "run_sha":os.environ.get("GITHUB_SHA"),
          }
          Path("results/ead_scored/provenance.json").write_text(json.dumps(p,indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multims2-ead-16ev-frozen-modality-transfer
          path: results/ead_scored/
          if-no-files-found: warn
          retention-days: 90
