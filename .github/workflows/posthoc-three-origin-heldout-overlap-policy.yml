name: posthoc-three-origin-heldout-overlap-policy
on:
  workflow_dispatch:
  push:
    branches: [research/multims2-ead-mechanism-lockbox-20261016]
    paths:
      - '.github/workflows/posthoc-three-origin-heldout-overlap-policy.yml'
permissions:
  contents: read
  actions: read
jobs:
  retrospective-origin-heldout:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run entire repo test suite; no changes to prediction model
        run: |
          set -euxo pipefail
          git fetch --depth=1 origin 4295a1ae7ead5f56a0d5b57a772cd651032d1362
          git diff --exit-code 4295a1ae7ead5f56a0d5b57a772cd651032d1362 -- \
            src/qfd/persistent_survival.py \
            src/qfd/power_geometry.py \
            src/qfd/target_blind_geometry.py \
            scripts/benchmark_multims2_ead_lockbox.py \
            scripts/benchmark_multims2_third_source_geometry.py
          python -m pip install -e '.[dev]'
          PYTHONPATH=src:. pytest -q
      - name: Download original already-scored endpoint descriptors and EAD rows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p frozen/cross_source frozen/ead results/origin_overlap_selector
          test "$(gh run view 38971589347 --repo "$GITHUB_REPOSITORY" --json conclusion -q .conclusion)" = success
          test "$(gh run view 38985827065 --repo "$GITHUB_REPOSITORY" --json conclusion -q .conclusion)" = success
          gh run download 38971589347 --repo "$GITHUB_REPOSITORY" \
            --name three-source-endpoint-geometry-support-mechanism --dir frozen/cross_source
          gh run download 38985827065 --repo "$GITHUB_REPOSITORY" \
            --name multims2-ead-positive-only-v2-frozen-scores --dir frozen/ead
      - name: Retrospective leave-one-ACQUISITION-ORIGIN-out selector fit and evaluation
        run: |
          set -euxo pipefail
          PYTHONPATH=src:. python scripts/evaluate_overlap_policy_origin_holdout.py \
            --features frozen/cross_source/features.jsonl \
            --three-source-metadata frozen/cross_source/result.json \
            --ead-rows frozen/ead/rows.jsonl \
            --ead-result frozen/ead/result.json \
            --out results/origin_overlap_selector
          cat results/origin_overlap_selector/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Retain explicit nonconfirmation class and original source provenance
        if: always()
        run: |
          mkdir -p results/origin_overlap_selector
          python - <<'PY'
          import json
          from pathlib import Path
          p={
             "evaluation_class":"POSTHOC MACHINE LEARNING ON ALREADY-OBSERVED SCORE ARTIFACTS",
             "origins":["MassBank","ExpoLib","MultiMS2 (CID+EAD TOGETHER)"],
             "source_level_independence":3,
             "fresh_untouched_data":False,
             "new_spectral_scoring_or_hyperparameter_scoring_on_query":False,
             "threshold_sweep_is_training_hyperparameter_search_and_retrospective":True,
          }
          Path("results/origin_overlap_selector/provenance.json").write_text(json.dumps(p,indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: three-origin-heldout-overlap-policy-posthoc
          path: results/origin_overlap_selector/
          retention-days: 90
          if-no-files-found: warn
