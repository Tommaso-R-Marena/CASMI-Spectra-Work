name: expolib-independent-metadata-feasibility

on:
  workflow_dispatch:
  push:
    branches: [research/expolib-independent-feasibility-20261016]
    paths:
      - '.github/workflows/expolib-independent-metadata-feasibility.yml'

permissions:
  contents: read

env:
  FROZEN_EXPOLIB_AUDIT_SHA: e5f5c6a4da0313d3e3967699f502bb6772ac7ee6

jobs:
  metadata-only:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify frozen source-selection and tests before examining new source
        run: |
          set -euxo pipefail
          git fetch --depth=1 origin "$FROZEN_EXPOLIB_AUDIT_SHA"
          git diff --exit-code "$FROZEN_EXPOLIB_AUDIT_SHA" -- \
            docs/EXPOLIB_INDEPENDENT_FEASIBILITY_PROTOCOL.md \
            scripts/audit_expolib_nominal_energy_feasibility.py \
            tests/test_expolib_independent_feasibility.py
          python -m pip install -e '.[dev]'
          PYTHONPATH=src:. pytest -q
      - name: Download independent University of Vienna ExpoLib v1 open MSPs and original discovery manifest
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/expolib results/expolib_independent_feasibility
          download_md5() {
            url="$1"; dest="$2"; checksum="$3"
            ok=0
            for attempt in 1 2 3 4 5 6; do
              rm -f "$dest"
              if curl -L --fail --retry 3 --retry-all-errors --retry-delay 4 \
                 --connect-timeout 30 --max-time 1800 "$url" -o "$dest"; then
                if echo "$checksum  $dest" | md5sum -c -; then ok=1; break; fi
              fi
              sleep 8
            done
            test "$ok" = 1
          }
          download_md5 'https://zenodo.org/records/18186811/files/ExpoLib1.0_ESI%2B.msp?download=1' \
            /tmp/expolib/positive.msp c08dcc4dc3c11eef188dff1eb1f2bc1d
          download_md5 'https://zenodo.org/records/18186811/files/ExpoLib1.0_ESI-.msp?download=1' \
            /tmp/expolib/negative.msp 3a7544d71bf9ee3564243095b3134d3d
          download_md5 'https://zenodo.org/records/21105617/files/20241003_mcebio_pos_ms2.json?download=1' \
            /tmp/expolib/original_discovery.jsonl 806f33c9c60af74a0aa21fb66aeb84f3
          sha256sum /tmp/expolib/* > results/expolib_independent_feasibility/input_sha256.txt
      - name: Audit new source on headers only; never score intensity
        shell: bash
        run: |
          set -euxo pipefail
          PYTHONPATH=src:. python scripts/audit_expolib_nominal_energy_feasibility.py \
            --positive /tmp/expolib/positive.msp \
            --negative /tmp/expolib/negative.msp \
            --discovery /tmp/expolib/original_discovery.jsonl \
            --out results/expolib_independent_feasibility
          cat results/expolib_independent_feasibility/feasibility.json >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve source provenance whether gate passes or fails
        if: always()
        run: |
          mkdir -p results/expolib_independent_feasibility
          python - <<'PY'
          import json,os
          from pathlib import Path
          p={
            "source":"ExpoLib v1, Zenodo 18186811, University of Vienna",
            "experiment":"LABEL-FREE EXTERNAL SOURCE FEASIBILITY ONLY",
            "no_target_spectral_peak_values_accessed":True,
            "physical_eV_unit_assumed":False,
            "frozen_audit_sha":os.environ["FROZEN_EXPOLIB_AUDIT_SHA"],
            "workflow_head_sha":os.getenv("GITHUB_SHA"),
          }
          (Path("results/expolib_independent_feasibility")/"provenance.json").write_text(json.dumps(p,indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expolib-v1-independent-header-only-feasibility
          path: results/expolib_independent_feasibility/
          if-no-files-found: warn
          retention-days: 90
