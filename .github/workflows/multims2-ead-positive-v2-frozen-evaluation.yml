name: multims2-ead-positive-v2-frozen-evaluation
on:
  workflow_dispatch:
  push:
    branches: [research/multims2-ead-mechanism-lockbox-20261016]
    paths:
      - 'docs/EAD_POSITIVE_V2_SCORE_LAUNCH_20261016.txt'
permissions:
  contents: read
  actions: read
env:
  PREOUTCOME_V2_SHA: d7130e3d6a3d72ef01387fd6262ac43afa618d7c
  METADATA_V2_GATE_RUN: '38985767245'
jobs:
  positive-only-cross-modality:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify V1 predictor and V2 cohort rule frozen before any EAD 16eV outcome
        run: |
          set -euxo pipefail
          git fetch --depth=1 origin "$PREOUTCOME_V2_SHA"
          git diff --exit-code "$PREOUTCOME_V2_SHA" -- \
            scripts/audit_multims2_ead_metadata.py \
            scripts/benchmark_multims2_ead_lockbox.py \
            scripts/ead_positive_only_v2_gate.py \
            scripts/benchmark_multims2_ead_positive_v2.py \
            src/qfd/persistent_survival.py \
            docs/MULTIMS2_EAD_HYBRID_LOCKBOX_PROTOCOL_20261016.md \
            docs/MULTIMS2_EAD_POSITIVE_ONLY_V2_PRESCORE_AMENDMENT.md
          python -m pip install -e '.[dev]'
          PYTHONPATH=src:. pytest -q
      - name: Require original scientific V1 gate FAIL and revised V2 positive-only metadata gate PASS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p frozen/v1 frozen/v2 frozen/cid /tmp/ead_v2 results/ead_positive_v2_scored
          test "$(gh run view 38985385615 --repo "$GITHUB_REPOSITORY" --json conclusion -q .conclusion)" = success
          test "$(gh run view "$METADATA_V2_GATE_RUN" --repo "$GITHUB_REPOSITORY" --json conclusion -q .conclusion)" = success
          gh run download 38985385615 --repo "$GITHUB_REPOSITORY" \
            --name multims2-ead-header-only-frozen-feasibility --dir frozen/v1
          gh run download "$METADATA_V2_GATE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name ead-positive-only-v2-prescore-eligibility --dir frozen/v2
          gh run download 38970318925 --repo "$GITHUB_REPOSITORY" \
            --name multims2-third-source-metadata-v2-fixed-brackets --dir frozen/cid
          echo '5345f532ded9baa4134d38b840a6e05a1b1f85b3cf19923569ea80d96f46289d  frozen/cid/frozen_triplets.jsonl' | sha256sum -c -
          python - <<'PY'
          from pathlib import Path
          import json
          v1=json.loads(Path("frozen/v1/feasibility.json").read_text())
          v2=json.loads(Path("frozen/v2/feasibility.json").read_text())
          assert v1["gate_pass"] is False and v1["coverage"]["negative_triplets"]==1
          assert v1["target_scores_or_predictor_outcomes_opened"] is False
          assert v2["gate_pass"] is True and v2["coverage"]["triplets"]==694
          assert v2["new_v2_target_intensity_opened"] is False
          assert v2["new_v2_outcome_scores_opened"] is False
          PY
      - name: Download same pinned MultiMS2 source and verify SHA256
        run: |
          set -euxo pipefail
          curl -L --fail --retry 6 --retry-all-errors --retry-delay 4 --connect-timeout 30 --max-time 2400 \
            'https://raw.githubusercontent.com/zamboni-lab/MultiMS2/659bd9b608408a75ecbb4b03295ed4c03ba52539/data/multims2_spectra.mgf' \
            -o /tmp/ead_v2/source.mgf
          test "$(stat -c '%s' /tmp/ead_v2/source.mgf)" = 77183510
          echo '4ef86f75a12ad2fdadbd63732e2d6690f4e506a6ff08f171758c1808d1249673  /tmp/ead_v2/source.mgf' | sha256sum -c -
      - name: Open all 694 frozen eligible EAD positive query target spectra and report negative/positive outcomes
        run: |
          set -euxo pipefail
          PYTHONPATH=src:. python scripts/benchmark_multims2_ead_positive_v2.py \
            --mgf /tmp/ead_v2/source.mgf \
            --original-v1-dir frozen/v1 \
            --gate-dir frozen/v2 \
            --cid-manifest frozen/cid/frozen_triplets.jsonl \
            --out results/ead_positive_v2_scored
          cat results/ead_positive_v2_scored/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Document both the failed V1 and revised V2 scientific statuses
        if: always()
        run: |
          mkdir -p results/ead_positive_v2_scored
          python - <<'PY'
          import json,os
          from pathlib import Path
          payload={
            "original_v1_all_polarity_scientific_gate":"FAILED — negative n=1, required n>=5",
            "original_v1_run":38985385615,
            "v2_polarity_only_change":"all 694 initially eligible EAD positive triplets, pre-score",
            "v2_metadata_gate_run":int(os.environ["METADATA_V2_GATE_RUN"]),
            "preoutcome_frozen_SHA":os.environ["PREOUTCOME_V2_SHA"],
            "same_original_MultiMS2_lab_and_instrument":True,
            "no_new_training_or_retuning":True,
            "run_commit_sha":os.getenv("GITHUB_SHA"),
          }
          Path("results/ead_positive_v2_scored/provenance.json").write_text(json.dumps(payload,indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multims2-ead-positive-only-v2-frozen-scores
          path: results/ead_positive_v2_scored/
          retention-days: 90
          if-no-files-found: warn
