name: multims2-prospective-metadata-only-gate-v1

on:
  workflow_dispatch:
  push:
    branches: [research/multims2-prospective-cid-20261016]
    paths:
      - '.github/workflows/multims2-prospective-metadata-only-gate-v1.yml'

permissions:
  contents: read
  actions: read

env:
  FROZEN_V1_GATE_SHA: e13282fe827cf84955359b16576454774d3c7ba5
  UPSTREAM_SHA: 659bd9b608408a75ecbb4b03295ed4c03ba52539

jobs:
  third-source-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check pre-score frozen protocol and parser; unit tests
        shell: bash
        run: |
          set -euxo pipefail
          git fetch --depth=1 origin "$FROZEN_V1_GATE_SHA"
          git diff --exit-code "$FROZEN_V1_GATE_SHA" -- \
            docs/MULTIMS2_THIRD_SOURCE_FROZEN_PROTOCOL_V1.md \
            scripts/audit_multims2_third_source_metadata.py \
            tests/test_multims2_metadata_gate.py
          python -m pip install -e '.[dev]'
          PYTHONPATH=src:. pytest -q
      - name: Download immutable prior-study identity artifacts without reading new source scores
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p frozen/msnlib frozen/massbank frozen/expolib results/multims2_metadata_v1
          gh run download 38934839645 --repo "$GITHUB_REPOSITORY" \
            --name posthoc-massbank-structure-nonoverlap-and-source-robustness --dir frozen/msnlib
          gh run download 38918658343 --repo "$GITHUB_REPOSITORY" \
            --name massbank-2026-03-frozen-external-efficacy --dir frozen/massbank
          gh run download 38964190641 --repo "$GITHUB_REPOSITORY" \
            --name expolib-v1-independent-header-only-feasibility --dir frozen/expolib
          echo '5520ecb3f134290953fd5ad63b97cc1561dd39c2ea658aeaf4a90b2be348d07a  frozen/msnlib/prior_evaluated_key_inventory.json' | sha256sum -c -
          echo '265dfb75e33d2eff3f19945255bddb5db0c0f7f9161593ada80cd2b50ecac9c4  frozen/massbank/label_free_triplets.jsonl' | sha256sum -c -
          echo '095340d967b177077ce517da7aa332795ce691899cc1320563cce07a76a68560  frozen/expolib/nominal_energy_triplets.jsonl' | sha256sum -c -
      - name: Retrieve original MSnLib discovery library (cryptographically pinned)
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/multims2
          ok=0
          for attempt in 1 2 3 4 5; do
            rm -f /tmp/multims2/discovery.json
            if curl --location --fail --retry 3 --retry-all-errors --retry-delay 4 \
                --connect-timeout 30 --max-time 1200 \
                'https://zenodo.org/records/21105617/files/20241003_mcebio_pos_ms2.json?download=1' \
                -o /tmp/multims2/discovery.json; then
              if echo '806f33c9c60af74a0aa21fb66aeb84f3  /tmp/multims2/discovery.json' | md5sum -c -; then ok=1; break; fi
            fi
            sleep 10
          done
          test "$ok" = 1
      - name: Download exact third-source CC0 MGF at upstream Git commit, not latest main
        shell: bash
        run: |
          set -euxo pipefail
          url="https://raw.githubusercontent.com/zamboni-lab/MultiMS2/${UPSTREAM_SHA}/data/multims2_spectra.mgf"
          ok=0
          for attempt in 1 2 3 4; do
            rm -f /tmp/multims2/multims2_spectra.mgf
            if curl --location --fail --retry 3 --retry-all-errors --retry-delay 4 \
                --connect-timeout 30 --max-time 2400 "$url" \
                -o /tmp/multims2/multims2_spectra.mgf; then
              if [ "$(stat -c '%s' /tmp/multims2/multims2_spectra.mgf)" = '77183510' ] && \
                [ "$(git hash-object /tmp/multims2/multims2_spectra.mgf)" = '5ca1b01d1c6c5b2930658a6cd32ee2659070b49d' ]; then
                ok=1; break
              fi
            fi
            sleep 10
          done
          test "$ok" = 1
          sha256sum /tmp/multims2/multims2_spectra.mgf > results/multims2_metadata_v1/input_raw_sha256.txt
      - name: Metadata-only CID triplet feasibility and strict cross-corpus exact-structure exclusions
        shell: bash
        run: |
          set -euxo pipefail
          PYTHONPATH=src:. python scripts/audit_multims2_third_source_metadata.py \
            --mgf /tmp/multims2/multims2_spectra.mgf \
            --discovery /tmp/multims2/discovery.json \
            --prior-inventory frozen/msnlib/prior_evaluated_key_inventory.json \
            --massbank-manifest frozen/massbank/label_free_triplets.jsonl \
            --expolib-manifest frozen/expolib/nominal_energy_triplets.jsonl \
            --out results/multims2_metadata_v1
          cat results/multims2_metadata_v1/feasibility.json >> "$GITHUB_STEP_SUMMARY"
      - name: Store execution provenance even if gate fails
        if: always()
        shell: bash
        run: |
          mkdir -p results/multims2_metadata_v1
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path("results/multims2_metadata_v1")
          (root/"provenance.json").write_text(json.dumps({
            "status":"STRICT METADATA-ONLY NEW-SOURCE GATE, NEVER EFFICACY",
            "upstream_commit":os.environ["UPSTREAM_SHA"],
            "frozen_protocol_gate_sha":os.environ["FROZEN_V1_GATE_SHA"],
            "current_runner_sha":os.getenv("GITHUB_SHA"),
            "query_peaks_opened":False,"model_scoring_authorized_here":False,
          },indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multims2-third-source-metadata-only-v1
          path: results/multims2_metadata_v1/
          if-no-files-found: warn
          retention-days: 90
