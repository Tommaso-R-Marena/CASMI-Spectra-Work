name: harmonized2026-firstlook-gnps-vs-msg-identification
on:
  workflow_dispatch:
  push:
    branches: [research/gnps-massspecgym-cross-library-lockbox-20261017]
    paths:
      - '.github/workflows/harmonized2026-crossprovider-scorer.yml'
      - 'scripts/benchmark_harmonized2026_crossprovider.py'
      - 'tests/test_harmonized2026_crossprovider.py'
permissions:
  contents: read
  actions: read
jobs:
  fifth-source-actual-molecule-id:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run entire original plus external source mathematical regression suite
        run: |
          set -euxo pipefail
          python -m pip install -e '.[dev]'
          PYTHONPATH=src:. pytest -q
      - name: Wait for strictly PRIOR checksum-verified native-identity gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p frozen/metadata results/firstlook
          gh run watch 39055589643 --repo "$GITHUB_REPOSITORY" --exit-status
          test "$(gh run view 39055589643 --repo "$GITHUB_REPOSITORY" --json conclusion -q .conclusion)" = success
          gh run download 39055589643 --repo "$GITHUB_REPOSITORY" \
            --name harmonized2026-cross-provider-native-identity-gate --dir frozen/metadata
          python - <<'PY'
          from pathlib import Path
          import json,os
          p=Path('frozen/metadata/feasibility.json')
          if not p.is_file():raise RuntimeError('prior native metadata gate missing')
          d=json.loads(p.read_text())
          assert d['status']=='HARMONIZED2026_CROSS_PROVIDER_NATIVE_HEADER_GATE_V1'
          assert d['query_peak_locations_or_intensities_opened'] is False
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('passed='+str(d['gate_pass']).lower()+'\n')
          if not d['gate_pass']:
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
                  f.write('Scientific metadata feasibility FAILED; no query or reference peaks opened.\n')
          PY
      - name: Re-download identical immutable 2026 source only after eligibility pass
        if: steps.gate.outputs.passed == 'true'
        run: |
          set -euxo pipefail
          mkdir -p /tmp/harmonized2026_replay
          curl -Lf --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 30 --max-time 3000 \
            'https://zenodo.org/records/20042904/files/combined-gnps-mass-spec-gym-npc-faithful.harmonized-subset.top128.mgf.zst?download=1' \
            -o /tmp/harmonized2026_replay/source.mgf.zst
          echo 'aee5a595960ef1284fe9977b6560a1ff771c07bb28c4a8e2e2ef47020b35724e  /tmp/harmonized2026_replay/source.mgf.zst' | sha256sum -c -
      - name: Replay frozen native eligibility BEFORE reading any peaks; score all actual molecule queries
        if: steps.gate.outputs.passed == 'true'
        run: |
          set -euxo pipefail
          PYTHONPATH=src:. python scripts/benchmark_harmonized2026_crossprovider.py \
            --zst /tmp/harmonized2026_replay/source.mgf.zst \
            --gate-dir frozen/metadata --out results/firstlook
          cat results/firstlook/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish complete scientific report/artifacts, including negative outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harmonized2026-independent-firstlook-molecular-ranking
          path: results/firstlook/
          retention-days: 90
          if-no-files-found: warn
