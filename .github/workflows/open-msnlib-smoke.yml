name: open-msnlib-smoke

on:
  push:
    branches: [open-msnlib-smoke]
    paths: [.github/workflows/open-msnlib-smoke.yml]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download small open MSnLib library
        run: |
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://zenodo.org/records/21105617/files/20241003_otavapep_pos_ms2.json?download=1' \
            -o /tmp/msnlib.jsonl
          ls -lh /tmp/msnlib.jsonl
      - name: Inspect JSONL schema
        run: |
          python - <<'PY'
          import json
          from collections import Counter, defaultdict
          from pathlib import Path

          path=Path('/tmp/msnlib.jsonl')
          records=[]
          total=0
          bad=0
          with path.open() as f:
              for line in f:
                  line=line.strip()
                  if not line:
                      continue
                  try:
                      rec=json.loads(line)
                  except Exception:
                      bad += 1
                      continue
                  total += 1
                  if len(records)<1000:
                      records.append(rec)

          report={
              'format':'jsonl',
              'file_bytes':path.stat().st_size,
              'record_count':total,
              'bad_lines':bad,
          }
          if records and isinstance(records[0],dict):
              report['first_record_keys']=sorted(map(str,records[0].keys()))
              report['first_record_types']={str(k):type(v).__name__ for k,v in records[0].items()}
              key_counts=Counter()
              interesting=defaultdict(list)
              spectype=Counter()
              energy_values=Counter()
              for rec in records:
                  if not isinstance(rec,dict):
                      continue
                  key_counts.update(rec.keys())
                  for k,v in rec.items():
                      sk=str(k); lk=sk.lower()
                      if any(t in lk for t in ['spect','collision','energy','smile','inchi','formula','precursor','peak','mz','adduct','compound','id']):
                          if len(interesting[sk])<8:
                              if isinstance(v,(str,int,float,bool,type(None))):
                                  interesting[sk].append(v)
                              elif isinstance(v,list):
                                  interesting[sk].append({'type':'list','len':len(v),'first':v[:3]})
                              elif isinstance(v,dict):
                                  interesting[sk].append({'type':'dict','keys':list(v)[:20]})
                              else:
                                  interesting[sk].append(type(v).__name__)
                      if lk=='spectype' or 'spectype' in lk:
                          spectype[str(v)] += 1
                      if 'collision' in lk and 'energy' in lk:
                          energy_values[str(v)] += 1
              report['key_counts_first1000']={str(k):int(v) for k,v in key_counts.most_common()}
              report['interesting_examples']=dict(interesting)
              report['spectype_counts_first1000']=dict(spectype.most_common(30))
              report['collision_energy_examples_first1000']=dict(energy_values.most_common(30))
          Path('schema_report.json').write_text(json.dumps(report,indent=2,default=str)+'\n')
          print(json.dumps(report,indent=2,default=str))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: msnlib-schema-report
          path: schema_report.json
