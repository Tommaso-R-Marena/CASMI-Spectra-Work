name: multims2-frozen-third-source-geometry-transfer

on:
  workflow_dispatch:
  push:
    branches: [research/multims2-prospective-cid-20261016]
    paths:
      - '.github/workflows/multims2-frozen-third-source-geometry-transfer.yml'

permissions:
  contents: read
  actions: read

env:
  SCORER_FROZEN_SHA: aa78b9a85f2038c8b5191b5e8c96f0f2af563aa2
  SOURCE_ADAPTER_FROZEN_SHA: bf5749e6aef1cc65dc1e06dcd528fc2e18022afb
  METADATA_GATE_RUN_ID: '38970318925'

jobs:
  independent-source-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check all score methods and CE decoder were frozen before MultiMS2 target outcomes
        shell: bash
        run: |
          set -euxo pipefail
          git fetch --depth=1 origin "$SCORER_FROZEN_SHA"
          git fetch --depth=1 origin "$SOURCE_ADAPTER_FROZEN_SHA"
          git diff --exit-code "$SCORER_FROZEN_SHA" -- \
            scripts/benchmark_multims2_third_source_geometry.py \
            src/qfd/power_geometry.py \
            src/qfd/target_blind_geometry.py \
            src/qfd/stats.py \
            docs/MULTIMS2_THIRD_SOURCE_FROZEN_PROTOCOL_V1.md
          git diff --exit-code "$SOURCE_ADAPTER_FROZEN_SHA" -- \
            scripts/benchmark_multims2_third_source_geometry_v2.py \
            scripts/audit_multims2_third_source_metadata_v2.py
          python -m pip install -e '.[dev]'
          PYTHONPATH=src:. pytest -q
      - name: Retrieve original independently gated 1,781-query metadata, SHA256-pinned
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p frozen/multims2_gate /tmp/multims2 results/multims2_third_source
          gh run download "$METADATA_GATE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name multims2-third-source-metadata-v2-fixed-brackets \
            --dir frozen/multims2_gate
          echo '941648b8653cf2ea258f357793e61f1da8162886a2c833d13239dcc714ca8377  frozen/multims2_gate/feasibility.json' | sha256sum -c -
          echo '5345f532ded9baa4134d38b840a6e05a1b1f85b3cf19923569ea80d96f46289d  frozen/multims2_gate/frozen_triplets.jsonl' | sha256sum -c -
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("frozen/multims2_gate/feasibility.json").read_text())
          assert p["gate_pass"] is True
          assert p["status"]=="MULTIMS2_CID_20_40_60EV_METADATA_ONLY_V2_BRACKETED_CE"
          assert p["coverage"]["triplets"]==1781
          assert p["coverage"]["structures"]==1414
          assert p["coverage"]["formula_blocks"]==1182
          assert p["coverage"]["positive_triplets"]==1174
          assert p["coverage"]["negative_triplets"]==607
          assert p["outcome_scores_opened"] is False
          PY
      - name: Re-download original 77MB CC0 source WITHOUT using any later upstream branch
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 6 --retry-all-errors --retry-delay 4 --connect-timeout 30 --max-time 2400 \
            'https://raw.githubusercontent.com/zamboni-lab/MultiMS2/659bd9b608408a75ecbb4b03295ed4c03ba52539/data/multims2_spectra.mgf' \
            -o /tmp/multims2/source.mgf
          test "$(stat -c '%s' /tmp/multims2/source.mgf)" = '77183510'
          test "$(git hash-object /tmp/multims2/source.mgf)" = '5ca1b01d1c6c5b2930658a6cd32ee2659070b49d'
          echo '4ef86f75a12ad2fdadbd63732e2d6690f4e506a6ff08f171758c1808d1249673  /tmp/multims2/source.mgf' | sha256sum -c -
      - name: FROZEN preoutcome quarter/Hellinger/support/adaptive evaluation on all 1,781 triplets
        shell: bash
        run: |
          set -euxo pipefail
          PYTHONPATH=src:. python scripts/benchmark_multims2_third_source_geometry_v2.py \
            --mgf /tmp/multims2/source.mgf \
            --metadata-dir frozen/multims2_gate \
            --out results/multims2_third_source
          cat results/multims2_third_source/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Persist complete experiment provenance even on failure
        if: always()
        shell: bash
        run: |
          mkdir -p results/multims2_third_source
          python - <<'PY'
          import json,os
          from pathlib import Path
          p={
            "research_class":"THIRD ACQUISITION SOURCE HELD-OUT 40eV TARGET CID INTERPOLATION",
            "metadata_only_run_id":int(os.environ["METADATA_GATE_RUN_ID"]),
            "original_v1_metadata_failure_run_id":38969490208,
            "header_only_v1_diagnostic_run_id":38969970105,
            "frozen_scorer_sha":os.environ["SCORER_FROZEN_SHA"],
            "frozen_bracket_CE_adapter_sha":os.environ["SOURCE_ADAPTER_FROZEN_SHA"],
            "workflow_sha":os.environ.get("GITHUB_SHA"),
            "upstream_commit":"659bd9b608408a75ecbb4b03295ed4c03ba52539",
            "source_sha256":"4ef86f75a12ad2fdadbd63732e2d6690f4e506a6ff08f171758c1808d1249673",
            "model_training_or_exponent_retuning":False,
            "source_only_one_laboratory":True,
          }
          (Path("results/multims2_third_source")/"provenance.json").write_text(json.dumps(p,indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multims2-third-independent-source-frozen-geometry
          path: results/multims2_third_source/
          if-no-files-found: warn
          retention-days: 90
