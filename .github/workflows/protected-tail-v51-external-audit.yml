name: protected-tail-v51-external-audit

on:
  workflow_dispatch:
  push:
    branches: [protected-tail-generalization-v5]
    paths:
      - '.github/workflows/protected-tail-v51-external-audit.yml'

permissions:
  contents: read

concurrency:
  group: protected-tail-v51-external-audit
  cancel-in-progress: false

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        dataset: [casmi2022, nist20]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install project and verify hardened rule
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install pandas
          PYTHONPATH=src pytest -q

      - name: Download and verify benchmark inputs
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/data /tmp/cfm results/protected_tail_v51/${{ matrix.dataset }}/source
          if [ '${{ matrix.dataset }}' = 'casmi2022' ]; then
            DATA_URL='https://zenodo.org/records/8399738/files/proc_casmi_2022.tgz?download=1'
            DATA_MD5='82364fafaff0ead065c0b7680da34215'
          else
            DATA_URL='https://zenodo.org/records/8399738/files/proc_nist20_outlier.tgz?download=1'
            DATA_MD5='dab95dd818a5bab14a22bee5551c861e'
          fi
          curl -L --fail --retry 3 --retry-delay 2 "$DATA_URL" -o /tmp/data.tgz
          echo "$DATA_MD5  /tmp/data.tgz" | md5sum -c -
          tar -xzf /tmp/data.tgz -C /tmp/data

          curl -L --fail --retry 3 --retry-delay 3 \
            'https://zenodo.org/records/8399738/files/cfm.tgz?download=1' \
            -o /tmp/cfm.tgz
          echo '9091cbc446124dc947cb2a7b01fe9c98  /tmp/cfm.tgz' | md5sum -c -
          if [ '${{ matrix.dataset }}' = 'casmi2022' ]; then
            MEMBER="$(tar -tzf /tmp/cfm.tgz | grep -E '(^|/)casmi22_spec_df\.pkl$' | head -n1)"
          else
            MEMBER="$(tar -tzf /tmp/cfm.tgz | grep -E '(^|/)pcasmi_spec_df\.pkl$' | head -n1)"
          fi
          test -n "$MEMBER"
          tar -xzf /tmp/cfm.tgz -C /tmp/cfm "$MEMBER"

      - name: Regenerate candidate feature artifact
        shell: bash
        run: |
          set -euxo pipefail
          if [ '${{ matrix.dataset }}' = 'casmi2022' ]; then
            PYTHONPATH=src:scripts python scripts/run_casmi2022_consensus_lockbox.py \
              /tmp/data /tmp/cfm benchmark_results/casmi_consensus_frozen_model.json \
              --out-dir results/protected_tail_v51/casmi2022/source
          else
            PYTHONPATH=src:scripts python scripts/run_nist20_outlier_consensus_lockbox.py \
              /tmp/data /tmp/cfm benchmark_results/casmi_consensus_frozen_model.json \
              --out-dir results/protected_tail_v51/nist20/source
          fi

      - name: Apply hardened protected-tail v5.1 rule
        shell: bash
        run: |
          set -euxo pipefail
          PYTHONPATH=src python scripts/analyze_protected_tail.py \
            results/protected_tail_v51/${{ matrix.dataset }}/source/candidate_features.csv.gz \
            --out results/protected_tail_v51/${{ matrix.dataset }}/protected_tail_v51.json \
            --overlap-threshold 0.8 \
            --protected-k 1 \
            --overlap-k 10 \
            --rr-cutoff 25 \
            --role external_to_rule_audit

      - name: Show compact hardened result
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('results/protected_tail_v51/${{ matrix.dataset }}/protected_tail_v51.json')
          d = json.loads(p.read_text())
          print(json.dumps({
              'dataset': '${{ matrix.dataset }}',
              'role': d['evaluation_role'],
              'source': d['source'],
              'rule': d['rule'],
              'invariant_audit': d['invariant_audit'],
              'static': d['static'],
              'protected_tail': d['protected_tail'],
              'delta': d['delta'],
              'usage': d['usage'],
          }, indent=2))
          PY

      - name: Record provenance
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('results/protected_tail_v51/${{ matrix.dataset }}/provenance.json')
          p.write_text(json.dumps({
              'dataset': '${{ matrix.dataset }}',
              'evaluation_role': 'external_to_rule_audit',
              'not_untouched_confirmation': True,
              'rule_version': 'protected-tail-v5.1-order-invariant-gate',
              'git_sha': os.environ.get('GITHUB_SHA'),
              'parameters': {'overlap_threshold': 0.8, 'protected_k': 1, 'overlap_k': 10},
          }, indent=2) + '\n')
          PY

      - name: Upload hardened audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protected-tail-v51-${{ matrix.dataset }}
          path: |
            results/protected_tail_v51/${{ matrix.dataset }}/protected_tail_v51.json
            results/protected_tail_v51/${{ matrix.dataset }}/provenance.json
          if-no-files-found: warn
          retention-days: 90
