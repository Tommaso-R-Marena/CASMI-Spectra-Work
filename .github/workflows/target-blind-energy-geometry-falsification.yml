name: target-blind-energy-geometry-falsification

on:
  workflow_dispatch:
  push:
    branches: [research/target-blind-energy-geometry-20261016]
    paths:
      - '.github/workflows/target-blind-energy-geometry-falsification.yml'

permissions:
  contents: read

env:
  FROZEN_TARGET_BLIND_SHA: fd98527278dfa9a44501857905abf0fe0633655d

jobs:
  posthoc-falsification:
    name: ${{ matrix.dataset }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - dataset: mcebio_neg
            file: 20241003_mcebio_neg_ms2.json
            md5: f0b8490cd619c9ea7fdea8de95393c28
          - dataset: mcedrug_pos
            file: 20241003_mcedrug_pos_ms2.json
            md5: c29a4b4c66abaaae0f30296dd486c224
          - dataset: mcedrug_neg
            file: 20241003_mcedrug_neg_ms2.json
            md5: 863fe98f5343209205805f9e7c0f92a2
          - dataset: mcescaf_pos
            file: 20241003_mcescaf_pos_ms2.json
            md5: 3ba52914a2f27239c5278c7d96888ecf
          - dataset: mcescaf_neg
            file: 20241003_mcescaf_neg_ms2.json
            md5: dee26d6f05fb92cbccc99a5a343d9cfb
          - dataset: enammol_pos
            file: 20241003_enammol_pos_ms2.json
            md5: ed6db189b4b5e1fc6a8cf3df211dbbe8
          - dataset: enammol_neg
            file: 20241003_enammol_neg_ms2.json
            md5: 88c934bd431582a346e486c8c14b76af
          - dataset: enamdisc_neg
            file: 20241003_enamdisc_neg_ms2.json
            md5: ad9c6e971a1902c091aeb4d555ca8db6

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify frozen target-blind implementation and tests
        shell: bash
        run: |
          set -euxo pipefail
          git fetch --depth=1 origin "$FROZEN_TARGET_BLIND_SHA"
          git diff --exit-code "$FROZEN_TARGET_BLIND_SHA" -- \
            docs/TARGET_BLIND_ENERGY_GEOMETRY_PROTOCOL.md \
            src/qfd/target_blind_geometry.py \
            scripts/benchmark_msnlib_target_blind_geometry.py \
            tests/test_target_blind_geometry.py
          python -m pip install -e '.[dev]'
          PYTHONPATH=src:. pytest -q
      - name: Download checksum-verified pinned MSnLib data with fresh-file retries
        shell: bash
        env:
          FILE: ${{ matrix.file }}
          MD5: ${{ matrix.md5 }}
        run: |
          set -euxo pipefail
          mkdir -p "results/target_blind/${{ matrix.dataset }}"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            rm -f /tmp/msnlib.jsonl
            if curl -L --fail --retry 3 --retry-all-errors --retry-delay 4 \
              --connect-timeout 30 --max-time 1800 \
              "https://zenodo.org/records/21105617/files/${FILE}?download=1" \
              -o /tmp/msnlib.jsonl; then
              if echo "${MD5}  /tmp/msnlib.jsonl" | md5sum -c -; then ok=1; break; fi
            fi
            sleep 8
          done
          test "$ok" = 1
          sha256sum /tmp/msnlib.jsonl | tee "results/target_blind/${{ matrix.dataset }}/input_sha256.txt"
      - name: Label-free original feasibility audit
        shell: bash
        run: |
          set -euxo pipefail
          PYTHONPATH=src:. python scripts/audit_msnlib_energy_geometry_loeo.py \
            /tmp/msnlib.jsonl \
            --dataset "${{ matrix.dataset }}" \
            --out "results/target_blind/${{ matrix.dataset }}/feasibility.json"
      - name: Apply unchanged eligibility gate
        id: gate
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          f=Path("results/target_blind/${{ matrix.dataset }}/feasibility.json")
          d=json.loads(f.read_text())
          passed=bool(d["gate_pass"])
          print(json.dumps({"dataset":d["dataset"],"coverage":d["coverage"],"gate_pass":passed},indent=2))
          with open(os.environ["GITHUB_OUTPUT"],"a") as g:
              g.write("pass="+("true" if passed else "false")+"\n")
          if not passed:
              print("FROZEN GATE FAILED: no prediction outcomes opened")
          PY
      - name: Open post-hoc target-blind comparison only if original gate passed
        if: steps.gate.outputs.pass == 'true'
        shell: bash
        run: |
          set -euxo pipefail
          PYTHONPATH=src:. python scripts/benchmark_msnlib_target_blind_geometry.py \
            /tmp/msnlib.jsonl \
            --dataset "${{ matrix.dataset }}" \
            --seed 20261016 \
            --out "results/target_blind/${{ matrix.dataset }}"
      - name: Write provenance regardless of gate/outcome
        if: always()
        shell: bash
        env:
          FILE: ${{ matrix.file }}
          MD5: ${{ matrix.md5 }}
        run: |
          mkdir -p "results/target_blind/${{ matrix.dataset }}"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          base=Path("results/target_blind/${{ matrix.dataset }}")
          raw=Path("/tmp/msnlib.jsonl")
          record={
            "dataset":"${{ matrix.dataset }}",
            "source_record":"21105617",
            "input_filename":os.environ["FILE"],
            "input_md5_expected":os.environ["MD5"],
            "input_sha256":hashlib.sha256(raw.read_bytes()).hexdigest() if raw.exists() else None,
            "frozen_implementation_sha":os.environ["FROZEN_TARGET_BLIND_SHA"],
            "workflow_sha":os.environ.get("GITHUB_SHA"),
            "evaluation":"POSTHOC",
            "target_in_reference_grid":False,
            "no_dataset_specific_refitting":True,
          }
          (base/"provenance.json").write_text(json.dumps(record,indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: target-blind-falsification-${{ matrix.dataset }}
          path: results/target_blind/${{ matrix.dataset }}/
          if-no-files-found: warn
          retention-days: 90
