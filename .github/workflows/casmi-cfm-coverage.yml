name: casmi-cfm-coverage

on:
  push:
    branches: [casmi-external-generalization]
    paths:
      - 'scripts/audit_casmi2016_cfm_coverage.py'
      - '.github/workflows/casmi-cfm-coverage.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: casmi-cfm-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install pandas numpy
      - name: Download CASMI 2016 processed benchmark
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/casmi2016 /tmp/cfm results/casmi_external
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://zenodo.org/records/8399738/files/proc_casmi_2016.tgz?download=1' \
            -o /tmp/proc_casmi_2016.tgz
          echo 'c24bae2a10e929d8a1570ae810d45278  /tmp/proc_casmi_2016.tgz' | md5sum -c -
          tar -xzf /tmp/proc_casmi_2016.tgz -C /tmp/casmi2016
      - name: Download CASMI-specific CFM predictions
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 --retry-delay 3 \
            'https://zenodo.org/records/8399738/files/cfm.tgz?download=1' \
            -o /tmp/cfm.tgz
          echo '9091cbc446124dc947cb2a7b01fe9c98  /tmp/cfm.tgz' | md5sum -c -
          CFM_MEMBER="$(tar -tzf /tmp/cfm.tgz | grep -E '(^|/)casmi_spec_df\.pkl$' | head -n1)"
          test -n "$CFM_MEMBER"
          tar -xzf /tmp/cfm.tgz -C /tmp/cfm "$CFM_MEMBER"
      - name: Audit truth and candidate coverage
        run: |
          python scripts/audit_casmi2016_cfm_coverage.py /tmp/casmi2016 /tmp/cfm \
            --output results/casmi_external/casmi2016_cfm_coverage.json
      - name: Persist coverage gate
        run: |
          cp results/casmi_external/casmi2016_cfm_coverage.json benchmark_results/casmi2016_cfm_coverage.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add benchmark_results/casmi2016_cfm_coverage.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record CASMI 2016 CFM coverage gate'
            git push
          fi
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casmi2016-cfm-coverage
          path: results/casmi_external/
          if-no-files-found: ignore
