name: protected-tail-v5-external-audit

on:
  workflow_dispatch:
  push:
    branches: [protected-tail-generalization-v5]
    paths:
      - '.github/workflows/protected-tail-v5-external-audit.yml'

permissions:
  contents: read

concurrency:
  group: protected-tail-v5-external-audit
  cancel-in-progress: false

jobs:
  casmi2022:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install project and benchmark dependencies
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install pandas

      - name: Verify v5 implementation
        run: PYTHONPATH=src pytest -q

      - name: Download verified CASMI 2022 inputs
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/casmi2022 /tmp/cfm results/protected_tail_v5/casmi2022/source
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://zenodo.org/records/8399738/files/proc_casmi_2022.tgz?download=1' \
            -o /tmp/proc_casmi_2022.tgz
          echo '82364fafaff0ead065c0b7680da34215  /tmp/proc_casmi_2022.tgz' | md5sum -c -
          tar -xzf /tmp/proc_casmi_2022.tgz -C /tmp/casmi2022
          curl -L --fail --retry 3 --retry-delay 3 \
            'https://zenodo.org/records/8399738/files/cfm.tgz?download=1' \
            -o /tmp/cfm.tgz
          echo '9091cbc446124dc947cb2a7b01fe9c98  /tmp/cfm.tgz' | md5sum -c -
          MEMBER="$(tar -tzf /tmp/cfm.tgz | grep -E '(^|/)casmi22_spec_df\.pkl$' | head -n1)"
          test -n "$MEMBER"
          tar -xzf /tmp/cfm.tgz -C /tmp/cfm "$MEMBER"

      - name: Regenerate unchanged candidate feature artifact
        shell: bash
        run: |
          set -euxo pipefail
          PYTHONPATH=src:scripts python scripts/run_casmi2022_consensus_lockbox.py \
            /tmp/casmi2022 /tmp/cfm \
            benchmark_results/casmi_consensus_frozen_model.json \
            --out-dir results/protected_tail_v5/casmi2022/source

      - name: Apply frozen protected-tail v5 rule
        shell: bash
        run: |
          set -euxo pipefail
          PYTHONPATH=src python scripts/analyze_protected_tail.py \
            results/protected_tail_v5/casmi2022/source/candidate_features.csv.gz \
            --out results/protected_tail_v5/casmi2022/protected_tail_v5.json \
            --overlap-threshold 0.8 \
            --protected-k 1 \
            --overlap-k 10 \
            --rr-cutoff 25 \
            --role external_to_rule_audit

      - name: Record provenance
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          out = Path('results/protected_tail_v5/casmi2022/provenance.json')
          out.write_text(json.dumps({
              'dataset': 'CASMI 2022',
              'evaluation_role': 'external_to_rule_audit',
              'not_untouched_confirmation': True,
              'protected_tail_rule': {'overlap_threshold': 0.8, 'protected_k': 1, 'overlap_k': 10},
              'git_sha': os.environ.get('GITHUB_SHA'),
              'source_md5': {
                  'proc_casmi_2022.tgz': '82364fafaff0ead065c0b7680da34215',
                  'cfm.tgz': '9091cbc446124dc947cb2a7b01fe9c98'
              }
          }, indent=2) + '\n')
          PY

      - name: Upload CASMI 2022 v5 audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protected-tail-v5-casmi2022
          path: |
            results/protected_tail_v5/casmi2022/protected_tail_v5.json
            results/protected_tail_v5/casmi2022/provenance.json
          if-no-files-found: warn
          retention-days: 90

  nist20:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install project and benchmark dependencies
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install pandas

      - name: Verify v5 implementation
        run: PYTHONPATH=src pytest -q

      - name: Download verified NIST20 Outlier inputs
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/nist20 /tmp/cfm results/protected_tail_v5/nist20/source
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://zenodo.org/records/8399738/files/proc_nist20_outlier.tgz?download=1' \
            -o /tmp/proc_nist20_outlier.tgz
          echo 'dab95dd818a5bab14a22bee5551c861e  /tmp/proc_nist20_outlier.tgz' | md5sum -c -
          tar -xzf /tmp/proc_nist20_outlier.tgz -C /tmp/nist20
          curl -L --fail --retry 3 --retry-delay 3 \
            'https://zenodo.org/records/8399738/files/cfm.tgz?download=1' \
            -o /tmp/cfm.tgz
          echo '9091cbc446124dc947cb2a7b01fe9c98  /tmp/cfm.tgz' | md5sum -c -
          MEMBER="$(tar -tzf /tmp/cfm.tgz | grep -E '(^|/)pcasmi_spec_df\.pkl$' | head -n1)"
          test -n "$MEMBER"
          tar -xzf /tmp/cfm.tgz -C /tmp/cfm "$MEMBER"

      - name: Regenerate unchanged candidate feature artifact
        shell: bash
        run: |
          set -euxo pipefail
          PYTHONPATH=src:scripts python scripts/run_nist20_outlier_consensus_lockbox.py \
            /tmp/nist20 /tmp/cfm \
            benchmark_results/casmi_consensus_frozen_model.json \
            --out-dir results/protected_tail_v5/nist20/source

      - name: Apply frozen protected-tail v5 rule
        shell: bash
        run: |
          set -euxo pipefail
          PYTHONPATH=src python scripts/analyze_protected_tail.py \
            results/protected_tail_v5/nist20/source/candidate_features.csv.gz \
            --out results/protected_tail_v5/nist20/protected_tail_v5.json \
            --overlap-threshold 0.8 \
            --protected-k 1 \
            --overlap-k 10 \
            --rr-cutoff 25 \
            --role external_to_rule_audit

      - name: Record provenance
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          out = Path('results/protected_tail_v5/nist20/provenance.json')
          out.write_text(json.dumps({
              'dataset': 'NIST20 Outlier / MassFormer pCASMI',
              'evaluation_role': 'external_to_rule_audit',
              'not_untouched_confirmation': True,
              'protected_tail_rule': {'overlap_threshold': 0.8, 'protected_k': 1, 'overlap_k': 10},
              'git_sha': os.environ.get('GITHUB_SHA'),
              'source_md5': {
                  'proc_nist20_outlier.tgz': 'dab95dd818a5bab14a22bee5551c861e',
                  'cfm.tgz': '9091cbc446124dc947cb2a7b01fe9c98'
              }
          }, indent=2) + '\n')
          PY

      - name: Upload NIST20 v5 audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protected-tail-v5-nist20
          path: |
            results/protected_tail_v5/nist20/protected_tail_v5.json
            results/protected_tail_v5/nist20/provenance.json
          if-no-files-found: warn
          retention-days: 90
