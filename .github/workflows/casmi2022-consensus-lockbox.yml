name: casmi2022-consensus-lockbox

on:
  workflow_dispatch:
  push:
    branches: [casmi-consensus-ranker-v2]
    paths:
      - '.lockbox/CASMI2022_RUN_ONCE'

permissions:
  contents: write

concurrency:
  group: casmi2022-consensus-lockbox
  cancel-in-progress: false

jobs:
  lockbox:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install project and benchmark dependencies
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install pandas rdkit

      - name: Run full test suite
        run: PYTHONPATH=src pytest -q

      - name: Verify frozen model and enforce one-shot state
        shell: bash
        run: |
          set -euxo pipefail
          test ! -f benchmark_results/casmi2022_consensus_lockbox_summary.json
          sha256sum -c benchmark_results/casmi_consensus_frozen_model.sha256
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('benchmark_results/casmi_consensus_frozen_model.json')
          d = json.loads(p.read_text())
          assert d['freeze_gate_passed'] is True
          assert d['feature_names'] == [
              'z_static_best', 'z_ordered_path', 'z_neg_energy_spread'
          ]
          assert d['l2'] == 1.0
          assert d['gate']['top_k'] == 10
          assert d['gate']['overlap_threshold'] == 0.2
          assert d['gate']['fallback'] == 'static_best'
          print('Frozen-model preflight passed.')
          PY

      - name: Download and verify CASMI 2016 and 2022 benchmarks
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/casmi2016 /tmp/casmi2022 /tmp/cfm results/casmi2022_consensus_lockbox/identity_overlap
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://zenodo.org/records/8399738/files/proc_casmi_2016.tgz?download=1' \
            -o /tmp/proc_casmi_2016.tgz
          echo 'c24bae2a10e929d8a1570ae810d45278  /tmp/proc_casmi_2016.tgz' | md5sum -c -
          tar -xzf /tmp/proc_casmi_2016.tgz -C /tmp/casmi2016
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://zenodo.org/records/8399738/files/proc_casmi_2022.tgz?download=1' \
            -o /tmp/proc_casmi_2022.tgz
          echo '82364fafaff0ead065c0b7680da34215  /tmp/proc_casmi_2022.tgz' | md5sum -c -
          tar -xzf /tmp/proc_casmi_2022.tgz -C /tmp/casmi2022

      - name: Audit 2016-training vs 2022-truth structural overlap before ranking
        shell: bash
        run: |
          set -euxo pipefail
          PYTHONPATH=src python scripts/audit_casmi_identity_overlap.py \
            /tmp/casmi2016 /tmp/casmi2022 \
            benchmark_results/casmi_consensus_frozen_model.json \
            --out-dir results/casmi2022_consensus_lockbox/identity_overlap

      - name: Download and verify CASMI 2022 CFM predictions
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 --retry-delay 3 \
            'https://zenodo.org/records/8399738/files/cfm.tgz?download=1' \
            -o /tmp/cfm.tgz
          echo '9091cbc446124dc947cb2a7b01fe9c98  /tmp/cfm.tgz' | md5sum -c -
          CFM_MEMBER="$(tar -tzf /tmp/cfm.tgz | grep -E '(^|/)casmi22_spec_df\.pkl$' | head -n1)"
          test -n "$CFM_MEMBER"
          tar -xzf /tmp/cfm.tgz -C /tmp/cfm "$CFM_MEMBER"

      - name: Run one-shot CASMI 2022 lockbox
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=src python scripts/run_casmi2022_consensus_lockbox.py \
            /tmp/casmi2022 /tmp/cfm \
            benchmark_results/casmi_consensus_frozen_model.json \
            --out-dir results/casmi2022_consensus_lockbox \
            2>&1 | tee results/casmi2022_consensus_lockbox/run.log

      - name: Append predeclared unseen-structure sensitivity analyses
        shell: bash
        run: |
          set -euxo pipefail
          PYTHONPATH=src:scripts python scripts/augment_casmi2022_nonoverlap_sensitivity.py \
            results/casmi2022_consensus_lockbox/summary.json \
            results/casmi2022_consensus_lockbox/per_query.csv \
            results/casmi2022_consensus_lockbox/identity_overlap/truth_overlap.csv \
            results/casmi2022_consensus_lockbox/identity_overlap/summary.json

      - name: Show compact lockbox result
        if: always()
        shell: bash
        run: |
          if [ -f results/casmi2022_consensus_lockbox/summary.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('results/casmi2022_consensus_lockbox/summary.json').read_text())
          p = d['primary_ge_0_99']
          print(json.dumps({
              'coverage': d['coverage'],
              'static': p['metrics']['static'],
              'expert': p['metrics']['expert'],
              'gated': p['metrics']['gated'],
              'gated_risk': p['risk']['gated'],
              'gated_inference': p['inference']['gated_vs_static'],
              'permuted_control_risk': p['risk']['permuted_control'],
              'expert_usage_fraction': p['expert_usage_fraction'],
              'replication_gate': p['replication_gate'],
              'identity_overlap_sensitivity': d.get('identity_overlap_sensitivity'),
          }, indent=2))
          PY
          fi

      - name: Persist immutable lockbox result
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p benchmark_results
          test ! -f benchmark_results/casmi2022_consensus_lockbox_summary.json
          cp results/casmi2022_consensus_lockbox/summary.json \
            benchmark_results/casmi2022_consensus_lockbox_summary.json
          cp results/casmi2022_consensus_lockbox/identity_overlap/summary.json \
            benchmark_results/casmi2022_identity_overlap_audit.json
          cp results/casmi2022_consensus_lockbox/identity_overlap/truth_overlap.csv \
            benchmark_results/casmi2022_identity_overlap_truths.csv
          sha256sum benchmark_results/casmi_consensus_frozen_model.json > \
            benchmark_results/casmi2022_frozen_model_used.sha256
          printf '%s\n' \
            'c24bae2a10e929d8a1570ae810d45278  proc_casmi_2016.tgz' \
            '82364fafaff0ead065c0b7680da34215  proc_casmi_2022.tgz' \
            '9091cbc446124dc947cb2a7b01fe9c98  cfm.tgz' > \
            benchmark_results/casmi2022_lockbox_input_md5.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            benchmark_results/casmi2022_consensus_lockbox_summary.json \
            benchmark_results/casmi2022_identity_overlap_audit.json \
            benchmark_results/casmi2022_identity_overlap_truths.csv \
            benchmark_results/casmi2022_frozen_model_used.sha256 \
            benchmark_results/casmi2022_lockbox_input_md5.txt
          git commit -m 'Record one-shot CASMI 2022 consensus lockbox result'
          git pull --rebase origin casmi-consensus-ranker-v2
          git push origin HEAD:casmi-consensus-ranker-v2

      - name: Upload complete lockbox artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casmi2022-consensus-lockbox
          path: results/casmi2022_consensus_lockbox/
          if-no-files-found: ignore
          retention-days: 90
