name: msnlib-unseen-collections-v53-lockbox

on:
  workflow_dispatch:
  push:
    branches: [v53-msnlib-unseen-collections-lockbox]
    paths:
      - '.github/workflows/msnlib-unseen-collections-v53-lockbox.yml'
      - 'scripts/audit_msnlib_unseen_collection.py'
      - 'docs/MSNLIB_UNSEEN_COLLECTIONS_V53_LOCKBOX_PROTOCOL.md'

permissions:
  contents: read

jobs:
  lockbox:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: enamdisc
            collection: ENAMDISC
            filename: 20241003_enamdisc_pos_ms2.json
            md5: b02b3a996e25aa1ad1cb06e8ccebf816
          - key: mcebio
            collection: MCEBIO
            filename: 20241003_mcebio_pos_ms2.json
            md5: 806f33c9c60af74a0aa21fb66aeb84f3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frozen code and run tests
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install pandas
          PYTHONPATH=src pytest -q

      - name: Download pinned OTAVAPEP prior-development exclusion set
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://zenodo.org/records/21105617/files/20241003_otavapep_pos_ms2.json?download=1' \
            -o /tmp/prior_otavapep.jsonl
          echo '748de9d811589b318fc0e248d5c56201  /tmp/prior_otavapep.jsonl' | md5sum -c -

      - name: Download pinned unseen target collection
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            "https://zenodo.org/records/21105617/files/${{ matrix.filename }}?download=1" \
            -o /tmp/target.jsonl
          echo '${{ matrix.md5 }}  /tmp/target.jsonl' | md5sum -c -

      - name: Label-free feasibility audit
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "results/unseen_v53/${{ matrix.key }}"
          PYTHONPATH=src python scripts/audit_msnlib_unseen_collection.py \
            /tmp/target.jsonl \
            --exclude-jsonl /tmp/prior_otavapep.jsonl \
            --out "results/unseen_v53/${{ matrix.key }}/feasibility.json" \
            --exclude-list-out "results/unseen_v53/${{ matrix.key }}/prior_full_inchikeys.txt" \
            --collection '${{ matrix.collection }}'

      - name: Enforce predeclared feasibility gate before ranking
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('results/unseen_v53/${{ matrix.key }}/feasibility.json')
          d = json.loads(p.read_text())
          print(json.dumps(d['coverage'], indent=2))
          if not d['gate_passed']:
              raise SystemExit('PREDECLARED FEASIBILITY GATE FAILED. Ranking remains unopened for this collection.')
          print('PREDECLARED FEASIBILITY GATE PASSED. Opening frozen ranking now.')
          PY

      - name: Export exact-condition candidate scores with frozen expert
        shell: bash
        run: |
          set -euxo pipefail
          PYTHONPATH=src python scripts/export_msnlib_exact_condition_candidates.py \
            /tmp/target.jsonl \
            --out "results/unseen_v53/${{ matrix.key }}/candidate_features_all.csv.gz" \
            --summary "results/unseen_v53/${{ matrix.key }}/candidate_export_summary.json" \
            --validation-fraction 0.5

      - name: Enforce OTAVAPEP structure disjointness and audited cohort identity
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          root = Path('results/unseen_v53/${{ matrix.key }}')
          prior = {x.strip() for x in (root / 'prior_full_inchikeys.txt').read_text().splitlines() if x.strip()}
          df = pd.read_csv(root / 'candidate_features_all.csv.gz')
          df = df.loc[~df['candidate_id'].isin(prior) & ~df['truth_id'].isin(prior)].copy()
          good = []
          for spec_id, g in df.groupby('spec_id', sort=False):
              if len(g) >= 2 and int(g['is_truth'].astype(bool).sum()) == 1:
                  good.append(g)
          if not good:
              raise SystemExit('no disjoint eligible queries after overlap removal')
          out = pd.concat(good, ignore_index=True)
          audit = json.loads((root / 'feasibility.json').read_text())
          nq = int(out['spec_id'].nunique())
          nf = int(out[['spec_id','formula']].drop_duplicates()['formula'].nunique())
          if nq != int(audit['coverage']['eligible_ambiguous_queries']):
              raise SystemExit(f'audited/ranked query mismatch: {nq} vs {audit["coverage"]["eligible_ambiguous_queries"]}')
          if nf != int(audit['coverage']['eligible_formula_blocks']):
              raise SystemExit(f'audited/ranked formula mismatch: {nf} vs {audit["coverage"]["eligible_formula_blocks"]}')
          out.to_csv(root / 'candidate_features_disjoint.csv.gz', index=False, compression='gzip')
          print({'queries': nq, 'formula_blocks': nf, 'candidate_rows': len(out)})
          PY

      - name: Apply frozen protected-tail v5.3
        shell: bash
        run: |
          set -euxo pipefail
          PYTHONPATH=src python scripts/analyze_protected_tail_v53.py \
            "results/unseen_v53/${{ matrix.key }}/candidate_features_disjoint.csv.gz" \
            --out "results/unseen_v53/${{ matrix.key }}/protected_tail_v53.json" \
            --overlap-threshold 0.8 \
            --protected-k 1 \
            --overlap-k 10 \
            --head-survival-slack 1 \
            --rr-cutoff 25 \
            --role 'prospective_structure_disjoint_cross_collection_lockbox' \
            --guardrail 'Frozen v5.3; target collection was feasibility-gated before ranking; all full-InChIKey overlap with OTAVAPEP was removed; no target outcome may be used for retuning.'

      - name: Formula-block inference and predeclared verdict
        shell: bash
        run: |
          PYTHONPATH=src python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          from qfd.stats import paired_block_bootstrap_delta, paired_block_signflip_test

          root = Path('results/unseen_v53/${{ matrix.key }}')
          df = pd.read_csv(root / 'candidate_features_disjoint.csv.gz')
          result = json.loads((root / 'protected_tail_v53.json').read_text())
          formula_by_query = df[['spec_id','formula']].drop_duplicates().set_index('spec_id')['formula'].to_dict()
          q = result['query_diagnostics']
          blocks = [formula_by_query[str(r['spec_id'])] for r in q]
          v53 = [float(r['rr_v53']) for r in q]
          static = [float(r['rr_static']) for r in q]
          perm = [float(r['rr_permuted_control']) for r in q]
          primary_ci = paired_block_bootstrap_delta(v53, static, blocks, n_boot=20000, seed=20260922)
          primary_test = paired_block_signflip_test(v53, static, blocks, seed=20260922, n_permutations=200000)
          control_ci = paired_block_bootstrap_delta(perm, static, blocks, n_boot=20000, seed=20260923)
          control_test = paired_block_signflip_test(perm, static, blocks, seed=20260923, n_permutations=200000)
          safe = bool(result['invariants']['top1_exactly_invariant'] and result['invariants']['v53_candidatewise_protected_topk_violations'] == 0)
          strong = bool(
              safe
              and primary_ci['delta'] > 0
              and primary_ci['ci_low'] > 0
              and primary_test['p_value_two_sided'] < 0.05
              and control_ci['ci_low'] <= 0
          )
          out = {
              'collection': '${{ matrix.collection }}',
              'evaluation_role': 'prospective_structure_disjoint_cross_collection_lockbox',
              'primary_delta_mrr25_formula_block_bootstrap': primary_ci,
              'primary_formula_block_signflip': primary_test,
              'permuted_control_delta_mrr25_formula_block_bootstrap': control_ci,
              'permuted_control_formula_block_signflip': control_test,
              'safety_endpoint_passed': safe,
              'predeclared_strong_positive_replication': strong,
              'selector_metrics': result['v53_vs_static'],
              'selector_usage': result['usage'],
          }
          (root / 'inference_and_verdict.json').write_text(json.dumps(out, indent=2) + '\n')
          print(json.dumps(out, indent=2))
          PY

      - name: Record provenance
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('results/unseen_v53/${{ matrix.key }}')
          root.mkdir(parents=True, exist_ok=True)
          (root / 'provenance.json').write_text(json.dumps({
              'collection': '${{ matrix.collection }}',
              'filename': '${{ matrix.filename }}',
              'zenodo_record': '21105617',
              'expected_md5': '${{ matrix.md5 }}',
              'prior_exclusion_collection': 'OTAVAPEP positive MS2',
              'prior_expected_md5': '748de9d811589b318fc0e248d5c56201',
              'frozen_selector_parent_sha': '0006c7f81c7dfac53da48690ca0fe627108b9767',
              'workflow_sha': os.environ.get('GITHUB_SHA'),
              'ranking_opened_only_after_gate': True,
          }, indent=2) + '\n')
          PY

      - name: Upload lockbox artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msnlib-unseen-v53-${{ matrix.key }}
          path: results/unseen_v53/${{ matrix.key }}/
          if-no-files-found: warn
          retention-days: 90
