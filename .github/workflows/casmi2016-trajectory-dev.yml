name: casmi2016-trajectory-dev

on:
  push:
    branches: [casmi2016-trajectory-dev]
    paths:
      - 'src/qfd/**'
      - 'scripts/run_casmi2016_trajectory_dev.py'
      - 'scripts/run_casmi2016_cfm_transfer.py'
      - 'tests/**'
      - '.github/workflows/casmi2016-trajectory-dev.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: casmi2016-trajectory-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trajectory-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and benchmark dependencies
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install pandas
      - name: Run full test suite
        run: PYTHONPATH=src pytest -q
      - name: Download and verify CASMI 2016 benchmark
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/casmi2016 /tmp/cfm results/casmi2016_trajectory_dev
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://zenodo.org/records/8399738/files/proc_casmi_2016.tgz?download=1' \
            -o /tmp/proc_casmi_2016.tgz
          echo 'c24bae2a10e929d8a1570ae810d45278  /tmp/proc_casmi_2016.tgz' | md5sum -c -
          tar -xzf /tmp/proc_casmi_2016.tgz -C /tmp/casmi2016
      - name: Download and verify CFM predictions
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 --retry-delay 3 \
            'https://zenodo.org/records/8399738/files/cfm.tgz?download=1' \
            -o /tmp/cfm.tgz
          echo '9091cbc446124dc947cb2a7b01fe9c98  /tmp/cfm.tgz' | md5sum -c -
          CFM_MEMBER="$(tar -tzf /tmp/cfm.tgz | grep -E '(^|/)casmi_spec_df\.pkl$' | head -n1)"
          test -n "$CFM_MEMBER"
          tar -xzf /tmp/cfm.tgz -C /tmp/cfm "$CFM_MEMBER"
      - name: Run preregistered trajectory development benchmark
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=src python scripts/run_casmi2016_trajectory_dev.py \
            /tmp/casmi2016 /tmp/cfm \
            --out-dir results/casmi2016_trajectory_dev \
            --seed 271828 2>&1 | tee results/casmi2016_trajectory_dev/run.log
      - name: Show compact result
        if: always()
        run: |
          if [ -f results/casmi2016_trajectory_dev/summary.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('results/casmi2016_trajectory_dev/summary.json').read_text())
          print(json.dumps({
              'coverage': d.get('coverage'),
              'development_selected': d.get('development',{}).get('selected_method'),
              'development_ranking': d.get('development',{}).get('method_ranking'),
              'validation_selected': d.get('internal_validation',{}).get('selected_method'),
              'validation_delta_mrr': d.get('internal_validation',{}).get('selected_delta_mrr'),
              'validation_gate': d.get('internal_validation',{}).get('gate'),
          }, indent=2))
          PY
          fi
      - name: Persist compact benchmark result
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p benchmark_results
          cp results/casmi2016_trajectory_dev/summary.json benchmark_results/casmi2016_trajectory_dev_summary.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add benchmark_results/casmi2016_trajectory_dev_summary.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record CASMI 2016 trajectory development result'
            git pull --rebase origin casmi2016-trajectory-dev
            git push origin HEAD:casmi2016-trajectory-dev
          fi
      - name: Upload trajectory development artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casmi2016-trajectory-dev
          path: results/casmi2016_trajectory_dev/
          if-no-files-found: ignore
