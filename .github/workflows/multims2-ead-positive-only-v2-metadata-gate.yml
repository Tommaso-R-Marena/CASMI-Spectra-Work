name: multims2-ead-positive-only-v2-metadata-gate
on:
  workflow_dispatch:
  push:
    branches: [research/multims2-ead-mechanism-lockbox-20261016]
    paths:
      - '.github/workflows/multims2-ead-positive-only-v2-metadata-gate.yml'
permissions:
  contents: read
  actions: read
env:
  V2_PREOUTCOME_FREEZE_SHA: d7130e3d6a3d72ef01387fd6262ac43afa618d7c
jobs:
  v2-header-only-retention:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify original model and V2 positive-only eligibility were frozen before target-peak scoring
        run: |
          set -euxo pipefail
          git fetch --depth=1 origin "$V2_PREOUTCOME_FREEZE_SHA"
          git diff --exit-code "$V2_PREOUTCOME_FREEZE_SHA" -- \
            scripts/ead_positive_only_v2_gate.py \
            scripts/benchmark_multims2_ead_positive_v2.py \
            scripts/audit_multims2_ead_metadata.py \
            scripts/benchmark_multims2_ead_lockbox.py \
            src/qfd/persistent_survival.py \
            docs/MULTIMS2_EAD_POSITIVE_ONLY_V2_PRESCORE_AMENDMENT.md
          python -m pip install -e '.[dev]'
          PYTHONPATH=src:. pytest -q
      - name: Download original V1 failure-only header and identity artifact (NO EAD peaks)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p frozen/v1 results/ead_positive_v2_gate
          test "$(gh run view 38985385615 --repo "$GITHUB_REPOSITORY" --json conclusion -q .conclusion)" = success
          gh run download 38985385615 --repo "$GITHUB_REPOSITORY" \
            --name multims2-ead-header-only-frozen-feasibility --dir frozen/v1
      - name: Create exact all-positive V2 metadata cohort; preserve V1 negative-polarity failure
        run: |
          set -euxo pipefail
          PYTHONPATH=src:. python scripts/ead_positive_only_v2_gate.py \
            --original-dir frozen/v1 --out results/ead_positive_v2_gate
          cat results/ead_positive_v2_gate/feasibility.json >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve new protocol and original failed scientific gate status
        if: always()
        run: |
          mkdir -p results/ead_positive_v2_gate
          python - <<'PY'
          import json,os
          from pathlib import Path
          payload={"protocol":"V2 AFTER metadata composition / BEFORE EAD 16eV outcome scoring",
                   "original_V1_failed_polarity_gate":True,
                   "original_v1_run_id":38985385615,
                   "positive_only_reason":"original V1 eligible negative mode n=1, cannot support 2-mode scientific claim",
                   "frozen_v2_sha":os.environ["V2_PREOUTCOME_FREEZE_SHA"],
                   "target_intensity_opened":False}
          Path("results/ead_positive_v2_gate/provenance.json").write_text(json.dumps(payload,indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ead-positive-only-v2-prescore-eligibility
          path: results/ead_positive_v2_gate/
          retention-days: 90
          if-no-files-found: warn
