name: casmi-external-audit

on:
  push:
    branches: [casmi-external-generalization]
    paths:
      - 'scripts/inspect_massformer_casmi.py'
      - '.github/workflows/casmi-external-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: casmi-external-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect-casmi2016-and-cfm:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install inspection dependencies
        run: python -m pip install pandas
      - name: Download and verify processed CASMI 2016 benchmark
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/casmi2016 results/casmi_external
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://zenodo.org/records/8399738/files/proc_casmi_2016.tgz?download=1' \
            -o /tmp/proc_casmi_2016.tgz
          echo 'c24bae2a10e929d8a1570ae810d45278  /tmp/proc_casmi_2016.tgz' | md5sum -c -
          md5sum /tmp/proc_casmi_2016.tgz | tee results/casmi_external/casmi2016_archive_md5.txt
          tar -xzf /tmp/proc_casmi_2016.tgz -C /tmp/casmi2016
          find /tmp/casmi2016 -maxdepth 4 -type f -printf '%P\t%s\n' | sort | tee results/casmi_external/casmi2016_file_listing.tsv
      - name: Inspect processed CASMI data schema
        run: |
          python scripts/inspect_massformer_casmi.py /tmp/casmi2016 \
            --output results/casmi_external/casmi2016_schema.json
      - name: Download and verify MassFormer CFM predictions
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/cfm
          curl -L --fail --retry 3 --retry-delay 3 \
            'https://zenodo.org/records/8399738/files/cfm.tgz?download=1' \
            -o /tmp/cfm.tgz
          echo '9091cbc446124dc947cb2a7b01fe9c98  /tmp/cfm.tgz' | md5sum -c -
          md5sum /tmp/cfm.tgz | tee results/casmi_external/cfm_archive_md5.txt
          tar -tzf /tmp/cfm.tgz | sort | tee results/casmi_external/cfm_archive_listing.txt
          CFM_MEMBER="$(grep -E '(^|/)casmi_spec_df\.pkl$' results/casmi_external/cfm_archive_listing.txt | head -n1)"
          CFM_RB_MEMBER="$(grep -E '(^|/)casmi_rb_spec_df\.pkl$' results/casmi_external/cfm_archive_listing.txt | head -n1 || true)"
          test -n "$CFM_MEMBER"
          tar -xzf /tmp/cfm.tgz -C /tmp/cfm "$CFM_MEMBER"
          if [ -n "$CFM_RB_MEMBER" ]; then tar -xzf /tmp/cfm.tgz -C /tmp/cfm "$CFM_RB_MEMBER"; fi
          find /tmp/cfm -type f -printf '%P\t%s\n' | sort | tee results/casmi_external/cfm_extracted_listing.tsv
      - name: Inspect CASMI-specific CFM prediction schema
        run: |
          python scripts/inspect_massformer_casmi.py /tmp/cfm \
            --output results/casmi_external/cfm_casmi2016_schema.json
      - name: Persist external-data audit
        run: |
          mkdir -p benchmark_results
          cp results/casmi_external/casmi2016_schema.json benchmark_results/casmi2016_external_schema.json
          cp results/casmi_external/casmi2016_archive_md5.txt benchmark_results/casmi2016_external_archive_md5.txt
          cp results/casmi_external/casmi2016_file_listing.tsv benchmark_results/casmi2016_external_file_listing.tsv
          cp results/casmi_external/cfm_casmi2016_schema.json benchmark_results/cfm_casmi2016_external_schema.json
          cp results/casmi_external/cfm_archive_md5.txt benchmark_results/cfm_external_archive_md5.txt
          cp results/casmi_external/cfm_extracted_listing.tsv benchmark_results/cfm_casmi2016_external_file_listing.tsv
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add benchmark_results/casmi2016_external_* benchmark_results/cfm_*external_*
          if ! git diff --cached --quiet; then
            git commit -m 'Record CASMI 2016 and CFM external data audit'
            git push
          fi
      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casmi2016-external-audit
          path: results/casmi_external/
          if-no-files-found: ignore
