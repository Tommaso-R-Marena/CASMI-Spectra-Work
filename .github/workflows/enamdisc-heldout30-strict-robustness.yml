name: enamdisc-heldout30-strict-robustness

on:
  workflow_dispatch:
  push:
    branches: [v53-independent-msnlib-lockboxes]
    paths:
      - '.github/workflows/enamdisc-heldout30-strict-robustness.yml'
      - 'scripts/export_msnlib_heldout30_candidates_strict.py'
      - 'src/qfd/energy_interpolation.py'
      - 'scripts/analyze_msnlib_heldout30_lockbox.py'

permissions:
  contents: read

env:
  DATASET_FILE: 20241003_enamdisc_pos_ms2.json
  DATASET_MD5: b02b3a996e25aa1ad1cb06e8ccebf816

jobs:
  strict_replay:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and test
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install -e '.[dev]'
          python -m pip install pandas
          PYTHONPATH=src:. pytest -q
      - name: Download pinned ENAMDISC
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p results/protected_tail_v53/enamdisc_heldout30_strict
          curl -L --fail --retry 4 --retry-delay 3 \
            "https://zenodo.org/records/21105617/files/${DATASET_FILE}?download=1" \
            -o /tmp/enamdisc.jsonl
          echo "${DATASET_MD5}  /tmp/enamdisc.jsonl" | md5sum -c -
          sha256sum /tmp/enamdisc.jsonl | tee results/protected_tail_v53/enamdisc_heldout30_strict/input_sha256.txt
      - name: Export exact frozen cohort with strict m/z alignment
        shell: bash
        run: |
          set -euxo pipefail
          PYTHONPATH=src:. python scripts/export_msnlib_heldout30_candidates_strict.py \
            /tmp/enamdisc.jsonl \
            --out results/protected_tail_v53/enamdisc_heldout30_strict/candidate_features.csv.gz \
            --summary results/protected_tail_v53/enamdisc_heldout30_strict/export_summary.json
      - name: Freeze validation rows and replay evaluator
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          root = Path('results/protected_tail_v53/enamdisc_heldout30_strict')
          df = pd.read_csv(root / 'candidate_features.csv.gz')
          val = df.loc[df['split'].eq('validation')].copy()
          val.to_csv(root / 'candidate_features_validation.csv.gz', index=False, compression='gzip')
          print({'validation_queries': int(val['spec_id'].nunique()), 'formula_blocks': int(val['formula'].nunique()), 'candidate_rows': int(len(val))})
          PY
          PYTHONPATH=src:. python scripts/analyze_msnlib_heldout30_lockbox.py \
            results/protected_tail_v53/enamdisc_heldout30_strict/candidate_features_validation.csv.gz \
            --out results/protected_tail_v53/enamdisc_heldout30_strict/validation_result.json \
            --split validation \
            --seed 20260922 \
            --overlap-threshold 0.8 \
            --protected-k 1 \
            --overlap-k 10 \
            --head-survival-slack 1
      - name: Upload strict robustness artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enamdisc-heldout30-strict-robustness
          path: results/protected_tail_v53/enamdisc_heldout30_strict/
          if-no-files-found: warn
          retention-days: 90
