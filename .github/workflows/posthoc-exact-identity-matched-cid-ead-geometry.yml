name: posthoc-exact-identity-matched-cid-ead-geometry
on:
  workflow_dispatch:
  push:
    branches: [research/multims2-ead-mechanism-lockbox-20261016]
    paths:
      - '.github/workflows/posthoc-exact-identity-matched-cid-ead-geometry.yml'
permissions:
  contents: read
  actions: read
jobs:
  paired-modality-falsification:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify no frozen CID or EAD predictors changed
        run: |
          set -euxo pipefail
          git fetch --depth=1 origin 4295a1ae7ead5f56a0d5b57a772cd651032d1362
          git diff --exit-code 4295a1ae7ead5f56a0d5b57a772cd651032d1362 -- \
            scripts/benchmark_multims2_third_source_geometry.py \
            scripts/benchmark_multims2_ead_lockbox.py \
            src/qfd/target_blind_geometry.py \
            src/qfd/power_geometry.py \
            src/qfd/persistent_survival.py
          git fetch --depth=1 origin d7130e3d6a3d72ef01387fd6262ac43afa618d7c
          git diff --exit-code d7130e3d6a3d72ef01387fd6262ac43afa618d7c -- \
            scripts/benchmark_multims2_ead_positive_v2.py
          python -m pip install -e '.[dev]'
          PYTHONPATH=src:. pytest -q
      - name: Download full original frozen scores only — no EAD raw peak rescoring
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p frozen/cid frozen/ead results/paired_modality
          test "$(gh run view 38970610885 --repo "$GITHUB_REPOSITORY" --json conclusion -q .conclusion)" = success
          test "$(gh run view 38985827065 --repo "$GITHUB_REPOSITORY" --json conclusion -q .conclusion)" = success
          gh run download 38970610885 --repo "$GITHUB_REPOSITORY" \
            --name multims2-third-independent-source-frozen-geometry --dir frozen/cid
          gh run download 38985827065 --repo "$GITHUB_REPOSITORY" \
            --name multims2-ead-positive-only-v2-frozen-scores --dir frozen/ead
          echo 'f97bfaee05e9197cdaa96ad995ab9019c995274820ff57f3b04bd04de12c2be6  frozen/cid/rows.jsonl' | sha256sum -c -
      - name: Exact-identity paired whole-compound contrast with formula-block uncertainty
        run: |
          set -euxo pipefail
          PYTHONPATH=src:. python scripts/audit_matched_cid_ead_geometry.py \
            --cid-rows frozen/cid/rows.jsonl \
            --ead-rows frozen/ead/rows.jsonl \
            --cid-result frozen/cid/result.json \
            --ead-result frozen/ead/result.json \
            --out results/paired_modality
          cat results/paired_modality/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve retrospective and causal confounding labels
        if: always()
        run: |
          mkdir -p results/paired_modality
          python - <<'PY'
          import json
          from pathlib import Path
          p={
             "classification":"POSTHOC WITHIN-IDENTITY CROSS-MODALITY REPLAY OF ALREADY-SCORED TARGETS",
             "CID_frozen_run":38970610885,
             "EAD_positive_original_V1_failed_run":38985385615,
             "EAD_positive_V2_scored_run":38985827065,
             "new_model_training_or_spectral_scoring":False,
             "modality_causality_established":False,
             "CI_independent_laboratories":False,
          }
          Path("results/paired_modality/provenance.json").write_text(json.dumps(p,indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-cid-vs-ead-identity-matched-comparison
          path: results/paired_modality/
          retention-days: 90
          if-no-files-found: warn
