name: energy-geometry-loeo-replication-matrix

on:
  workflow_dispatch:
  push:
    branches: [v53-independent-msnlib-lockboxes]
    paths:
      - '.github/workflows/energy-geometry-loeo-replication-matrix.yml'

permissions:
  contents: read

env:
  FROZEN_IMPL_SHA: 9a77ce8eee6820581fd1d05ffd42502bf55b25c2

jobs:
  replicate:
    name: ${{ matrix.dataset }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - dataset: mcebio_neg
            file: 20241003_mcebio_neg_ms2.json
            md5: f0b8490cd619c9ea7fdea8de95393c28
            status: independent_polarity_replication
          - dataset: mcedrug_pos
            file: 20241003_mcedrug_pos_ms2.json
            md5: c29a4b4c66abaaae0f30296dd486c224
            status: independent_library_replication
          - dataset: mcedrug_neg
            file: 20241003_mcedrug_neg_ms2.json
            md5: 863fe98f5343209205805f9e7c0f92a2
            status: independent_library_polarity_replication
          - dataset: mcescaf_pos
            file: 20241003_mcescaf_pos_ms2.json
            md5: 3ba52914a2f27239c5278c7d96888ecf
            status: independent_library_replication
          - dataset: mcescaf_neg
            file: 20241003_mcescaf_neg_ms2.json
            md5: dee26d6f05fb92cbccc99a5a343d9cfb
            status: independent_library_polarity_replication
          - dataset: enammol_pos
            file: 20241003_enammol_pos_ms2.json
            md5: ed6db189b4b5e1fc6a8cf3df211dbbe8
            status: independent_library_replication
          - dataset: enammol_neg
            file: 20241003_enammol_neg_ms2.json
            md5: 88c934bd431582a346e486c8c14b76af
            status: independent_library_polarity_replication
          - dataset: enamdisc_neg
            file: 20241003_enamdisc_neg_ms2.json
            md5: ad9c6e971a1902c091aeb4d555ca8db6
            status: independent_polarity_replication
          - dataset: enamdisc_pos_triangulation
            file: 20241003_enamdisc_pos_ms2.json
            md5: b02b3a996e25aa1ad1cb06e8ccebf816
            status: triangulation_only_prior_heldout30_observed

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify unchanged frozen LOEO implementation
        shell: bash
        run: |
          set -euxo pipefail
          git fetch --depth=1 origin "$FROZEN_IMPL_SHA"
          git diff --exit-code "$FROZEN_IMPL_SHA" -- \
            src/qfd/energy_geometry.py \
            src/qfd/energy_interpolation.py \
            scripts/audit_msnlib_energy_geometry_loeo.py \
            scripts/benchmark_msnlib_energy_geometry_loeo.py \
            docs/ENERGY_GEOMETRY_LOEO_PROTOCOL.md
          python -m pip install -e '.[dev]'
          PYTHONPATH=src:. pytest -q
      - name: Download and verify pinned dataset
        shell: bash
        env:
          DATASET_FILE: ${{ matrix.file }}
          DATASET_MD5: ${{ matrix.md5 }}
        run: |
          set -euxo pipefail
          mkdir -p "results/energy_geometry_replications/${{ matrix.dataset }}"
          curl -L --fail --retry 4 --retry-delay 3 \
            "https://zenodo.org/records/21105617/files/${DATASET_FILE}?download=1" \
            -o /tmp/msnlib.jsonl
          echo "${DATASET_MD5}  /tmp/msnlib.jsonl" | md5sum -c -
          sha256sum /tmp/msnlib.jsonl | tee "results/energy_geometry_replications/${{ matrix.dataset }}/input_sha256.txt"
      - name: Label-free feasibility audit
        shell: bash
        run: |
          set -euxo pipefail
          PYTHONPATH=src:. python scripts/audit_msnlib_energy_geometry_loeo.py \
            /tmp/msnlib.jsonl \
            --dataset "${{ matrix.dataset }}" \
            --out "results/energy_geometry_replications/${{ matrix.dataset }}/feasibility.json"
      - name: Check frozen gate without opening failed cohorts
        id: gate
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('results/energy_geometry_replications/${{ matrix.dataset }}/feasibility.json')
          d=json.loads(p.read_text())
          passed=bool(d['gate_pass'])
          print(json.dumps({'coverage':d['coverage'],'gate':d['predeclared_gate'],'gate_pass':passed},indent=2))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f"pass={'true' if passed else 'false'}\n")
          if not passed:
              print('FROZEN GATE FAILED: efficacy scores remain unopened for this dataset.')
          PY
      - name: Open unchanged frozen LOEO outcomes
        if: steps.gate.outputs.pass == 'true'
        shell: bash
        run: |
          set -euxo pipefail
          PYTHONPATH=src:. python scripts/benchmark_msnlib_energy_geometry_loeo.py \
            /tmp/msnlib.jsonl \
            --dataset "${{ matrix.dataset }}" \
            --seed 20260922 \
            --out "results/energy_geometry_replications/${{ matrix.dataset }}/result.json"
      - name: Record immutable provenance
        if: always()
        shell: bash
        env:
          DATASET_FILE: ${{ matrix.file }}
          DATASET_MD5: ${{ matrix.md5 }}
        run: |
          mkdir -p "results/energy_geometry_replications/${{ matrix.dataset }}"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('results/energy_geometry_replications/${{ matrix.dataset }}')
          inp=Path('/tmp/msnlib.jsonl')
          p={
            'dataset':'${{ matrix.dataset }}',
            'replication_status':'${{ matrix.status }}',
            'zenodo_record':'21105617',
            'filename':os.environ['DATASET_FILE'],
            'expected_md5':os.environ['DATASET_MD5'],
            'input_sha256':hashlib.sha256(inp.read_bytes()).hexdigest() if inp.exists() else None,
            'frozen_impl_sha':os.environ['FROZEN_IMPL_SHA'],
            'workflow_git_sha':os.environ.get('GITHUB_SHA'),
            'no_dataset_specific_retuning':True,
          }
          (root/'provenance.json').write_text(json.dumps(p,indent=2)+'\n')
          PY
      - name: Upload replication artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: energy-geometry-replication-${{ matrix.dataset }}
          path: results/energy_geometry_replications/${{ matrix.dataset }}/
          if-no-files-found: warn
          retention-days: 90
